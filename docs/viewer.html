<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viewer - pet-babelfish</title>
  <script>(function(){var t=localStorage.getItem('pb-theme');if(t)document.documentElement.dataset.theme=t;})()</script>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--text);
           display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ─────────────────────────────────────────────────── */
    /* .pb-header (theme.css) styles the bar; these tune the viewer's own fields. */
    .pb-header select { cursor: pointer; }
    .pb-header input[type=search] { flex: 1 1 240px; min-width: 180px; max-width: 420px; }
    #statusBar { font-size: 0.72rem; color: var(--text4); white-space: nowrap;
                 font-family: var(--font-mono); }

    /* ── Read-only active-spec summary strip (replaces the old filter editor) ── */
    .spec-summary { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
                    padding: 0.4rem 1rem; border-bottom: 1px solid var(--border);
                    background: var(--bg2); flex-shrink: 0; font-family: var(--font-ui); }
    .spec-summary .ss-link { margin-left: 0.25rem; }
    .spec-summary .chip-x { font-size: 1rem; padding: 0 0.3rem; line-height: 1; }
    .spec-summary .ss-note { color: var(--text4); font-size: 0.75rem; }
    /* Mobile-only collapse toggle for the facet chips (hidden on desktop via .mobile-only). */
    .spec-toggle { background: none; border: 1px solid var(--border3); color: var(--text2);
                   border-radius: var(--radius); padding: 0.15rem 0.5rem; cursor: pointer;
                   font-family: var(--font-ui); font-size: 0.75rem; white-space: nowrap; }

    /* ── 3-panel layout ──────────────────────────────────────────── */
    .layout { display: grid; grid-template-columns: var(--sidebar-w, 220px) 5px 1fr 42%;
              flex: 1; overflow: hidden; min-height: 0; }

    /* Drag gutter between sidebar and parts panel. */
    .resizer { cursor: col-resize; background: transparent; transition: background 0.12s; }
    .resizer:hover, .resizer.dragging { background: var(--accent); }
    body.resizing { cursor: col-resize; user-select: none; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar { border-right: 1px solid var(--border); overflow-y: auto; font-size: 0.78rem; }
    .mg-header { padding: 0.4rem 0.75rem; background: var(--bg3); color: var(--text3);
                 cursor: pointer; user-select: none; display: flex; justify-content: space-between;
                 align-items: center; position: sticky; top: 0; z-index: 1; }
    .mg-header:hover { background: var(--bg2); color: var(--text2); }
    .mg-header .arrow { font-size: 0.65rem; transition: transform 0.15s; }
    .mg-header.open .arrow { transform: rotate(90deg); }
    .sec-item { padding: 0.25rem 0.75rem 0.25rem 1.2rem; cursor: pointer;
                color: var(--text2); display: flex; justify-content: flex-start; gap: 0.4rem; }
    .sec-item:hover { background: var(--bg2); color: var(--text); }
    .sec-item.active { background: var(--accent-bg); color: var(--accent); }
    .sec-item .sec-num { flex-shrink: 0; }
    .sec-item .sec-title { color: var(--text4); font-size: 0.72rem; overflow: hidden;
                           text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .sidebar-placeholder { padding: 1rem; color: var(--text5); font-size: 0.8rem; }

    /* ── Parts panel ─────────────────────────────────────────────── */
    .parts-panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
    .parts-header { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.82rem;
                    color: var(--text3); flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem; }
    .parts-header .section-id { color: var(--accent); font-weight: bold; }
    .parts-header .count { color: var(--text5); font-size: 0.72rem; }
    .parts-scroll { flex: 1; overflow-y: auto; }
    table.parts { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.parts th { background: var(--bg3); color: var(--text3); padding: 0.3rem 0.5rem; text-align: left;
                     border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1;
                     font-weight: normal; white-space: nowrap; }
    table.parts td { padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--row-border);
                     vertical-align: top; }
    table.parts tr:hover td { background: var(--row-hover); }
    .col-pos         { width: 3.6rem; color: var(--accent); white-space: nowrap; font-family: var(--font-mono); }
    .pos-paren { color: var(--text3); font-style: italic; }
    .pos-none  { color: var(--text5); }
    /* Expander is a real tap target - sized, padded, and shows the hidden count. */
    .pos-expand { font-size: 0.72rem; cursor: pointer; color: var(--text4); user-select: none;
                  display: inline-flex; align-items: center; justify-content: center;
                  vertical-align: middle; margin-right: 3px; line-height: 1;
                  min-width: 1.3rem; padding: 2px 3px; border-radius: 3px;
                  font-family: var(--font-ui); }
    .pos-expand:hover { color: var(--accent); background: var(--accent-bg); }
    table.parts tr.pos-subrow td { background: var(--bg2); }
    /* Every column shrinks to its contents (width:1% resolves up to min-content);
       only .col-desc flexes, so it absorbs all leftover table width. */
    .col-pn    { width: 1%; white-space: nowrap; color: var(--pn); font-family: var(--font-mono); }
    .pn-link   { color: inherit; text-decoration: none; }
    .pn-link:hover { text-decoration: underline; }
    .col-desc  { width: 100%; }
    .col-sec   { width: 1%; white-space: nowrap; }
    .col-qty   { width: 2.5rem; text-align: center; color: var(--text2); font-family: var(--font-mono); }
    .col-rem   { width: 1%; white-space: nowrap; color: var(--text3); font-size: 0.72rem; font-family: var(--font-mono); }
    /* Per-vehicle columns - only rendered when a garage vehicle is open. */
    .col-ok    { width: 1%; text-align: center; }
    /* min-width, not width: .col-desc's width:100% otherwise starves this column
       down to the placeholder, since the input's width:100% contributes no
       min-content of its own. */
    .col-notes { width: 1%; min-width: 12rem; }
    .ok-box    { cursor: pointer; accent-color: var(--accent); margin: 0; vertical-align: middle; }
    .ok-hd     { display: inline-flex; align-items: center; gap: 4px; }
    .note-input { width: 100%; background: transparent; border: 1px solid transparent;
                  border-radius: 3px; color: var(--text2); font-family: monospace;
                  font-size: 0.72rem; padding: 1px 3px; }
    .note-input::placeholder { color: var(--text6); }
    .note-input:hover  { border-color: var(--border2); }
    .note-input:focus  { outline: none; border-color: var(--accent); background: var(--bg); color: var(--text); }
    table.parts tr.part-ok td.col-pn { color: var(--accent); }
    .appl-chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 0.25rem; }
    .appl-chip  { border-radius: 2px; padding: 0 0.3rem; font-size: 0.63rem; line-height: 1.6;
                  white-space: nowrap; border: 1px solid var(--border2); background: var(--bg3);
                  font-family: var(--font-mono); }
    .appl-pr    { color: var(--accent); border-color: var(--accent-bd); background: var(--accent-bg2); }
    .appl-mj    { color: var(--pn); }
    .appl-dest  { color: var(--text2); }
    .appl-other { color: var(--text4); }

    /* Always-visible applicability-chip colour key - usable without hover (touch). */
    .appl-key { margin-left: auto; display: inline-flex; align-items: center; gap: 3px;
                flex-shrink: 0; }
    .appl-key .appl-chip { min-width: 1.9rem; text-align: center; }
    .appl-key-label { color: var(--text4); font-size: 0.66rem; margin-left: 3px;
                      font-family: var(--font-ui); }
    .parts-placeholder { padding: 2rem; color: var(--text5); font-size: 0.85rem; text-align: center; }

    /* Search results */
    .search-result-row td { border-bottom: 1px solid var(--row-border); padding: 0.25rem 0.5rem; vertical-align: top; }
    .search-result-row:hover td { background: var(--row-hover); }
    .search-result-row.preview-active td { background: var(--accent-bg); }
    .col-open { width: 1%; white-space: nowrap; text-align: right; }
    .open-btn { font-size: 0.68rem; padding: 0.1rem 0.4rem; }
    .sec-badge { display: inline-block; background: var(--accent-bg2); border: 1px solid var(--accent-bd);
                 border-radius: 3px; padding: 0 0.3rem; font-size: 0.68rem; color: var(--accent);
                 font-family: var(--font-mono); }

    /* ── Diagram panel ───────────────────────────────────────────── */
    /* The viewport (.diagram-scroll) clips; the transformed .diagram-wrap holds the
       image and callout canvas together, so a single CSS transform zooms/pans both
       and keeps the overlay registered. Overlays (controls/legend/hint) are siblings
       of the wrap so they stay put. */
    .diagram-panel { display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .diagram-scroll { flex: 1; position: relative; overflow: hidden; background: var(--bg4);
                      cursor: grab; touch-action: none; }
    .diagram-scroll.panning { cursor: grabbing; }
    .diagram-wrap { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
    .diagram-wrap img { width: 100%; height: 100%; display: block; object-fit: contain;
                        -webkit-user-drag: none; user-select: none; }
    #callout-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
    .diagram-placeholder { position: absolute; inset: 0; display: flex; align-items: center;
                           justify-content: center; color: var(--text6); font-size: 0.85rem; }

    /* On-screen zoom/pan controls + collapse. */
    .diagram-controls { position: absolute; top: 0.5rem; right: 0.5rem; z-index: 5;
                        display: flex; gap: 0.25rem; }
    .diagram-btn { padding: 0.15rem 0.4rem; min-width: 1.9rem; justify-content: center;
                   background: var(--bg2); font-size: 0.85rem; }

    /* One-time discoverability hint. */
    .diagram-hint { position: absolute; top: 0.5rem; left: 50%; transform: translateX(-50%);
                    z-index: 6; background: var(--accent-bg); color: var(--accent);
                    border: 1px solid var(--accent-bd); border-radius: var(--radius);
                    padding: 0.3rem 0.6rem; font-size: 0.72rem; cursor: pointer;
                    font-family: var(--font-ui); box-shadow: 0 2px 8px rgba(0,0,0,0.25);
                    max-width: 90%; text-align: center; }
    .diagram-hint .hint-dismiss { margin-left: 0.4rem; opacity: 0.7; }

    /* Collapsed diagram: reclaim the column; a fixed tab brings it back. */
    .layout.diagram-collapsed { grid-template-columns: var(--sidebar-w, 220px) 5px 1fr 0; }
    .layout.diagram-collapsed .diagram-panel { display: none; }
    .diagram-reopen { position: fixed; right: 0; top: 50%; transform: translateY(-50%);
                      z-index: 20; padding: 0.55rem 0.35rem; background: var(--bg2);
                      border: 1px solid var(--border3); border-right: none; color: var(--text2);
                      border-radius: var(--radius) 0 0 var(--radius); cursor: pointer;
                      font-family: var(--font-ui); font-size: 0.7rem; writing-mode: vertical-rl; }
    .diagram-reopen:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Part row highlighting ───────────────────────────────────── */
    table.parts tr.pos-active td { background: var(--accent-bg) !important; }
    table.parts tr:hover td { background: var(--row-hover); }

    /* Loading spinner */
    .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border);
               border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Search results only - a section's table drops filtered parts outright. Search
       is a way into the catalog, so a hit the filter rejects still has to be there
       to click through to. */
    tr.part-no-match td { opacity: 0.25; }
    tr.part-no-match:hover td { opacity: 0.45; }

    /* ── Mobile single-column view (≤820px) ──────────────────────────
       Desktop is untouched: the segmented control and the mobile-only
       affordances are display:none, and every override below lives inside
       the media query. All three panes stay in the DOM; CSS shows only the
       active one via .layout[data-mpane]. */
    .mobile-tabs { display: none; }
    .mobile-only { display: none; }

    @media (max-width: 820px) {
      .mobile-tabs { display: flex; gap: 0.35rem; padding: 0.4rem 1rem;
                     border-bottom: 1px solid var(--border); background: var(--bg2);
                     flex-shrink: 0; }
      .mobile-tabs .btn { flex: 1; justify-content: center; }
      .mobile-only { display: inline-flex; }

      /* Compact top chrome: the section count and the helper prose don't change and
         eat the vertical space the parts list / diagram actually need. Drop them, and
         collapse the vehicle's facet chips behind the "N filters" toggle. */
      #statusBar { display: none; }
      /* The active vehicle's catalog is fixed and implied by its 🚗 name chip. */
      .pb-header .cat-chip { display: none; }
      .spec-summary { padding: 0.3rem 1rem; gap: 0.3rem; }
      .spec-summary .ss-note { display: none; }
      .spec-summary .chip { display: none; }
      .spec-summary.m-open .chip { display: inline-flex; }

      /* Single column, single full-height row. Override the inline --sidebar-w
         grid and the desktop diagram-collapsed grid alike. */
      .layout, .layout.diagram-collapsed {
        grid-template-columns: 1fr; grid-template-rows: 1fr;
      }
      .resizer { display: none; }
      .diagram-reopen { display: none; }

      /* Show only the active pane. Sidebar keeps its natural block display;
         the flex panes are restored explicitly. These [data-mpane] selectors
         match the desktop diagram-collapsed rule's specificity and win by
         source order, so a stale desktop collapse can't hide the diagram here. */
      .layout[data-mpane="sections"] .parts-panel,
      .layout[data-mpane="sections"] .diagram-panel,
      .layout[data-mpane="parts"]    .sidebar,
      .layout[data-mpane="parts"]    .diagram-panel,
      .layout[data-mpane="diagram"]  .sidebar,
      .layout[data-mpane="diagram"]  .parts-panel { display: none; }
      .layout[data-mpane="parts"]   .parts-panel   { display: flex; }
      .layout[data-mpane="diagram"] .diagram-panel { display: flex; }
    }
  </style>
</head>
<body x-data="viewerApp()" x-init="init()">

  <header class="pb-header">
    <h1>pet-babelfish</h1>
    <template x-if="activeVehicle">
      <span class="chip chip-accent" title="Active garage vehicle">
        <span x-text="activeVehicle.nickname || 'vehicle'"></span>
      </span>
    </template>

    <input type="search" class="inp mono" placeholder="Search part number or description…"
           x-model="query"
           @input.debounce.300ms="search()"
           @keydown.escape="clearSearch()"
           :disabled="!db">

    <!-- Catalog: a free switcher only when browsing unfiltered. Under an active
         vehicle the catalog is fixed by that vehicle (changing it silently drops
         vehicle mode), so show it read-only - clear the vehicle to browse another. -->
    <template x-if="!activeVehicle">
      <select class="inp" x-model="catalogId" @change="loadCatalog()">
        <option value="">- select catalog -</option>
        <template x-for="c in catalogs" :key="c.id">
          <option :value="c.id" x-text="c.label"></option>
        </template>
      </select>
    </template>
    <template x-if="activeVehicle">
      <span class="chip cat-chip" title="Catalog is fixed by the active vehicle - clear it (×) to browse another"
            x-text="activeCatalogLabel"></span>
    </template>

    <template x-if="vehicleMode">
      <button class="btn" :class="{on: hideOk}" @click="hideOk = !hideOk"
              title="Hide parts marked Ok, and sections where every part is marked Ok">
        Hide Ok<template x-if="hideOk && okSectionIds.size"><span class="btn-badge" x-text="okSectionIds.size"></span></template>
      </button>
    </template>

    <span class="spacer"></span>
    <span id="statusBar" x-text="status"></span>
    <a href="index.html">home</a>
    <button class="theme-toggle" onclick="themeToggle.cycle()">auto</button>
  </header>

  <!-- Mobile pane switcher - hidden above the 820px breakpoint. Drives which
       single pane .layout shows via mobilePane / [data-mpane]. -->
  <div class="mobile-tabs">
    <button class="btn" :class="{on: mobilePane==='sections'}" @click="mobilePane='sections'">Sections</button>
    <button class="btn" :class="{on: mobilePane==='parts'}" @click="mobilePane='parts'">Parts</button>
    <button class="btn" :class="{on: mobilePane==='diagram'}" @click="mobilePane='diagram'">Diagram</button>
  </div>

  <!-- Read-only active-spec summary - filtering now comes only from the saved
       vehicle, so this shows what the vehicle scopes to and links back to edit it. -->
  <template x-if="activeVehicle">
    <div class="spec-summary" :class="{'m-open': mSpecOpen}">
      <!-- Mobile: chips collapse behind this count so the strip is one slim line. -->
      <button class="spec-toggle mobile-only" @click="mSpecOpen = !mSpecOpen"
              x-text="(specChips.length ? specChips.length + ' filter' + (specChips.length === 1 ? '' : 's') : 'no filters') + (mSpecOpen ? ' ▴' : ' ▾')"></button>
      <template x-for="(chip, ci) in specChips" :key="ci">
        <span class="chip" :title="chip.title || ''" x-text="chip.t"></span>
      </template>
      <template x-if="!specChips.length">
        <span class="ss-note">no spec set - this vehicle shows the whole catalog</span>
      </template>
      <a class="btn ss-link" :href="'index.html?edit=' + activeVehicle.id"
         title="Open this vehicle in the spec editor">Edit vehicle →</a>
      <span class="chip-x" title="Clear vehicle - browse the catalog unfiltered"
            @click="clearActiveVehicle()">×</span>
    </div>
  </template>
  <template x-if="!activeVehicle && db">
    <div class="spec-summary">
      <a class="btn btn-primary"
         :href="'index.html?addVehicle=1&catalog=' + encodeURIComponent(catalogId) + '&return=viewer'"
         title="Pick or create a vehicle to scope this catalog to one car">
        Filter to a vehicle…
      </a>
      <span class="ss-note">Browsing the full catalog - scope it to a car to get Ok/Notes and only its parts.</span>
    </div>
  </template>

  <div class="layout" :class="{ 'diagram-collapsed': diagramCollapsed }" :data-mpane="mobilePane">

    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <div class="sidebar">
      <template x-if="!db && !loading">
        <div class="sidebar-placeholder">Load a catalog to browse sections.</div>
      </template>
      <template x-if="loading">
        <div class="sidebar-placeholder"><span class="spinner"></span> Loading…</div>
      </template>
      <template x-for="mg in mainGroups" :key="mg.id">
        <div x-show="visibleSections(mg).length > 0">
          <div class="mg-header" :class="{open: mg.open}" @click="mg.open = !mg.open">
            <span x-text="mg.title || ('Group ' + mg.number)"></span>
            <span class="arrow">▶</span>
          </div>
          <template x-if="mg.open">
            <div>
              <template x-for="sec in visibleSections(mg)" :key="sec.id">
                <div class="sec-item" :class="{active: currentSection && sec.id === currentSection.id}"
                     @click="selectSection(sec, mg)">
                  <span class="sec-num" x-text="sec.number"></span>
                  <span class="sec-title" x-text="sec.title"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <div class="resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical"
         title="Drag to resize - double-click to reset"></div>

    <!-- ── Parts panel ─────────────────────────────────────────── -->
    <div class="parts-panel">
      <div class="parts-header">
        <!-- Mobile-only shortcut into the diagram pane (display:none on desktop). -->
        <button class="btn mobile-only" x-show="currentSection && currentSection.has_diagram"
                @click="mobilePane='diagram'" title="View the parts diagram">Diagram →</button>
        <template x-if="searchMode">
          <span>
            Search: <strong x-text="query"></strong>
            <span class="count" x-text="filterActive
              ? (searchMatchCount + ' / ' + searchResults.length + ' results match')
              : (searchResults.length + ' results')"></span>
            <button style="background:none;border:none;color:var(--text4);cursor:pointer;font-family:monospace;margin-left:0.5rem"
                    @click="clearSearch()">✕ clear</button>
          </span>
        </template>
        <template x-if="!searchMode && currentSection">
          <span>
            <span class="section-id" x-text="currentSection.number"></span>
            <span x-text="currentSection.title ? ' — ' + currentSection.title : ''"></span>
            <span x-text="currentSection.title_remark ? ' · ' + currentSection.title_remark : ''"
                  style="color:var(--text4)"></span>
            <span x-text="currentSection.title_model ? ' [' + currentSection.title_model + ']' : ''"
                  style="color:var(--text5);font-size:0.72rem"></span>
            <!-- Section-level scope gates every part in the section - show it, or a
                 filtered-out section looks empty for no visible reason. -->
            <template x-if="currentSectionAppl">
              <span class="appl-chips" style="display:inline-flex;vertical-align:middle;margin:0 0 0 0.4rem">
                <template x-for="(chip, ci) in parseAppl(currentSectionAppl)" :key="ci">
                  <span class="appl-chip" :class="'appl-' + chip.type"
                        :title="'Applies to the whole section'" x-text="chip.text"></span>
                </template>
              </span>
            </template>
            <span class="count" x-text="filterActive ? (filterSectionCount + ' / ' + parts.length + ' match') : (parts.length + ' parts')"></span>
            <span class="count" x-show="hiddenOkCount > 0" x-text="'· ' + hiddenOkCount + ' Ok hidden'"></span>
          </span>
        </template>
        <template x-if="!searchMode && !currentSection">
          <span style="color:var(--text5)">Select a section</span>
        </template>
        <!-- Always-visible colour key for the applicability chips (touch-friendly). -->
        <span class="appl-key" x-show="currentSection || searchMode"
              title="Coloured tags on a part show what scopes it to a car">
          <span class="appl-chip appl-pr">PR</span>
          <span class="appl-chip appl-mj">MJ</span>
          <span class="appl-chip appl-dest">mkt</span>
          <span class="appl-chip appl-other">·</span>
          <span class="appl-key-label">option · year · market · other</span>
        </span>
      </div>

      <div class="parts-scroll">
        <!-- Search results table -->
        <template x-if="searchMode">
          <table class="parts">
            <thead>
              <tr>
                <th class="col-pos">Pos</th>
                <th class="col-sec">Section</th>
                <th class="col-pn">Part Number</th>
                <th class="col-desc">Description</th>
                <th class="col-qty">Qty</th>
                <th class="col-open"></th>
              </tr>
            </thead>
            <tbody>
              <template x-if="searchResults.length === 0">
                <tr><td colspan="6" class="parts-placeholder">No results.</td></tr>
              </template>
              <!-- Clicking a result previews its diagram in the right pane without
                   leaving the results - so you can click down the list and see each on
                   its diagram. "Open →" is the explicit jump to that section's parts. -->
              <template x-for="(p, i) in searchResults" :key="i">
                <tr class="search-result-row" @click="previewResult(p, i)" style="cursor:pointer"
                    :class="{'part-no-match': filterActive && !partMatchesVehicle(p.applicability, p._scope),
                             'preview-active': previewIndex === i}">
                  <td class="col-pos" x-text="p.position"></td>

          <div class="parts-placeholder">No part in this section is on this vehicle.</div>
        </template>
        <template x-if="!searchMode && currentSection && parts.length > 0 && displayRows.length === 0 && emptyReason === 'ok'">
          <div class="parts-placeholder">
            Every part here is marked Ok.
            <a href="#" style="color:var(--accent)" @click.prevent="hideOk = false">show them</a>
          </div>

    <!-- ── Diagram panel ────────────────────────────────────────── -->
    <div class="diagram-panel">

             together, keeping the overlay registered. See _positionCanvas/onDiagramWheel. -->
        <div x-show="diagramUrl" class="diagram-wrap"
