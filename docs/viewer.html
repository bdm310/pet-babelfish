  <script>
    // Sidebar drag-resize. Width lives in --sidebar-w on .layout; persisted across sessions.
    (function () {
      const DEFAULT_W = 220, MIN_W = 140, MIN_PARTS = 260, GUTTER = 5, KEY = 'pb-sidebar-w';
      const layout  = document.querySelector('.layout');
      const resizer = document.getElementById('sidebar-resizer');
      const apply = w => layout.style.setProperty('--sidebar-w', Math.round(w) + 'px');

      // The diagram column is a fixed %, so the parts panel absorbs everything the
      // sidebar takes. Stop before it gets crushed rather than at some viewport fraction.
      const maxW = () => {
        const diagram = document.querySelector('.diagram-panel');
        const avail = layout.clientWidth - (diagram ? diagram.offsetWidth : 0) - GUTTER - MIN_PARTS;
        return Math.max(MIN_W, avail);
      };

      const saved = parseInt(localStorage.getItem(KEY), 10);
      if (saved) apply(Math.min(Math.max(saved, MIN_W), maxW()));

      let dragging = false;
      resizer.addEventListener('pointerdown', e => {
        dragging = true;
        resizer.setPointerCapture(e.pointerId);
        resizer.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
      });
      resizer.addEventListener('pointermove', e => {
        if (!dragging) return;
        const x = e.clientX - layout.getBoundingClientRect().left;
        apply(Math.min(Math.max(x, MIN_W), maxW()));
      });
      const end = e => {
        if (!dragging) return;
        dragging = false;
        resizer.releasePointerCapture(e.pointerId);
        resizer.classList.remove('dragging');
        document.body.classList.remove('resizing');
        localStorage.setItem(KEY, parseInt(layout.style.getPropertyValue('--sidebar-w'), 10));
      };
      resizer.addEventListener('pointerup', end);
      resizer.addEventListener('pointercancel', end);

      resizer.addEventListener('dblclick', () => {
        apply(DEFAULT_W);
        localStorage.setItem(KEY, DEFAULT_W);
      });

      // Keep the sidebar within bounds if the window shrinks under it.
      window.addEventListener('resize', () => {
        const cur = parseInt(layout.style.getPropertyValue('--sidebar-w'), 10);
        if (cur && cur > maxW()) apply(maxW());
      });
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="theme.js"></script>
  <script src="appl.js"></script>
  <script src="vin.js"></script>
  <script src="schema.js"></script>
  <script src="ccitt.js"></script>
  <script src="catalogs.js"></script>
  <script src="garage.js"></script>
  <script>
    const SQLJS_WASM = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.wasm';

    // A section's whole scope, in the grammar. Its printed applicability holds the
    // option and year gates; the typed columns hold the facets the title row states
    // as bare tokens ("G9750,G9788"). All of them gate every part in the section, and
    // APPL ANDs across facets, so one string of segments is their conjunction.
    const sectionScope = (...cols) => cols.filter(Boolean).join(' | ');

    // Nobody knows their car by its EC/TC code, so name it with what the catalog says
    // about it. A transmission's `type_code` is speeds plus A(utomatik) or
    // S(chaltgetriebe) — the reading the option-code derivation depends on too. An
    // unfamiliar shape is left as printed rather than guessed at.
    const gearboxLabel = (tc, type) => {
      const m = /^(\d)([AS])$/.exec(String(type || '').toUpperCase());
      return [tc, type, m && `${m[1]}-speed ${m[2] === 'A' ? 'automatic' : 'manual'}`]
             .filter(Boolean).join(' — ');
    };
    const engineLabel = (ec, displacement, hp) =>
      [ec, [displacement && displacement + ' l', hp && hp + ' hp'].filter(Boolean).join(', ')]
      .filter(Boolean).join(' — ');

    // FTS4 matches whole tokens, so "Headlight" misses every "Headlights" — the
    // catalog pluralises freely and recall must not depend on the user guessing
    // which form was printed. Each bare term becomes a prefix term.
    // Left alone: a quoted phrase (the quotes are the user asking for exactly
    // that), FTS's own operators, a wildcard already typed, and any term not
    // ending in a word character — "*" after punctuation is a syntax error, and
    // an error here silently drops the whole query to the LIKE fallback.
    const FTS_OPERATORS = new Set(['AND', 'OR', 'NOT', 'NEAR']);
    const ftsPrefixQuery = q =>
      (String(q).match(/"[^"]*"?|\S+/g) || [])
        .map(t => (t.startsWith('"') || FTS_OPERATORS.has(t) || !/\w$/.test(t))
                    ? t : t + '*')
        .join(' ');

    function viewerApp() {
      return {
        catalogs:       [],
        catalogId:      '',
        db:             null,
        SQL:            null,
        mainGroups:     [],
        currentSection: null,
        currentMg:      null,
        parts:          [],
        posGroups:      [],
        displayRows:    [],
        diagramUrl:     null,
        _diagramToken:  0,
        callouts:       [],
        hoveredPos:     null,
        selectedPos:    null,
        query:          '',
        searchMode:     false,
        searchResults:  [],
        loading:        false,
        status:         '',

        // file-mode: true when loaded via ?sqlite=URL instead of OPFS
        sqliteFileMode: false,

        // vehicle filter
        filterPanelOpen:  false,
        vfYear:           '',
        vfMarket:         '',
        vfLine:           '',
        vfBody:           '',
        vfDrive:          '',
        vfTrim:           '',
        vfEngine:         '',
        vfGearbox:        '',
        vfChassis:        '',
        vfEngineNo:       '',
        vfPrCodes:        [],
        prListOpen:       false,
        prSearch:         '',
        prDropdownOpen:   false,
        allPrCodes:       [],
        prDropdownItems:  [],
        prUnknown:        [],   // entered codes not in this catalog's pr_code

        // Facet vocabularies, read from the open catalog — see loadFacetOptions.
        engineOptions:    [],   // { code, label }
        gearboxOptions:   [],
        lineOptions:      [],   // plain strings
        bodyOptions:      [],
        driveOptions:     [],   // '2'/'4' — offered when the catalog has AWD variants
        trimOptions:      [],   // 'S'/'GTS'/'RS'/'RS 4.0'
        marketOptions:    [],
        _index:           null, // full APPL.buildIndex opts (codeIndex, prCodes, lines, dialect, yearPivot)
        dialect:          'modern',
        yearPivot:        null,
        _vinRanges:       [],   // { from, to } — chassis blocks, for breakpoints
        _engineNumRanges: [],   // { from, to } — engine-number blocks
        _transmissRanges: [],   // { from, to } — transmission-number blocks (356/PDK serials)
        _spec:            null, // vehicleSpec memo

        // VIN decode
        vinInput:         '',
        vinResult:        null,   // { ...decoded, matches:[…] } | { error }
        _vinIndex:        null,   // cached cross-catalog vin_range rows

        // active garage vehicle (opened via ?vehicle=<id>)
        activeVehicle:    null,
        partMeta:         {},   // partKey -> { ok, notes } for activeVehicle
        _noteTimers:      {},   // partKey -> debounce timer for notes writes

        // hide-Ok filter (vehicle mode only)
        hideOk:           false,

        // Sidebar rollups — sections the sidebar drops. See _recomputeSectionRollups.
        okSectionIds:     new Set(),   // every in-scope part marked Ok (hide-Ok only)
        emptySectionIds:  new Set(),   // the spec filter admits none of its parts
        _sectionParts:    null,  // sectionId -> [{ key, appl, scope }]; see _sectionPartIndex
        _rollupTimer:     null,

        // Ok/Notes are per-vehicle, so only offer them while actually viewing the
        // open vehicle's own catalog (the catalog picker can move off it).
        get vehicleMode() {
          return !!this.activeVehicle && this.activeVehicle.catalogId === this.catalogId;
        },

        // Every field the spec filter reads. One list so a new facet can't be added
        // to the form and silently skipped by the filter, the watchers or the reset.
        get _specValues() {
          return [this.vfYear, this.vfMarket, this.vfLine, this.vfBody, this.vfDrive,
                  this.vfTrim, this.vfEngine, this.vfGearbox, this.vfChassis, this.vfEngineNo];
        },

        get filterActive() { return !!(this._specValues.some(Boolean) || this.vfPrCodes.length); },
        get filterCriteriaCount() {
          return this._specValues.filter(Boolean).length + this.vfPrCodes.length;
        },
        get filterSectionCount() {
          if (!this.filterActive || !this.parts.length) return '0';
          return String(this.parts.filter(p => this.partMatchesVehicle(p.applicability, this.currentSectionScope)).length);
        },

        // ── Init ────────────────────────────────────────────────────

        async init() {
          this.status = 'Loading sql.js…';
          this.SQL = await initSqlJs({ locateFile: () => SQLJS_WASM });
          this.status = '';
          this.$watch('hoveredPos',  () => this.drawCallouts());
          this.$watch('selectedPos', () => this.drawCallouts());
          this.$watch('hideOk', () => { this._rebuildDisplayRows(); this._scheduleRollups(); });
          // The spec filter decides which parts the open section lists, which
          // sections the sidebar lists at all, which parts a section's Ok rollup
          // counts, and which callouts belong on the car's diagram.
          for (const f of ['vfYear', 'vfMarket', 'vfLine', 'vfBody', 'vfDrive', 'vfTrim',
                           'vfEngine', 'vfGearbox', 'vfChassis', 'vfEngineNo', 'vfPrCodes'])
            this.$watch(f, () => {
              this._rebuildDisplayRows(); this._scheduleRollups(); this.drawCallouts();
            });
          window.addEventListener('resize', () => requestAnimationFrame(() => this._positionCanvas()));
          this._startQueryBridge();

          const params = new URLSearchParams(location.search);
          const sqliteUrl = params.get('sqlite');
          if (sqliteUrl) {
            await this.loadFromUrl(sqliteUrl);
          } else {
            await this.listCatalogs();
            const vid = params.get('vehicle');
            if (vid) {
              await this.openVehicle(vid);
            } else {
              const cid = params.get('catalog');
              if (cid) {
                this.catalogId = cid;
                await this.loadCatalog();
              }
            }
          }
        },

        // ── Garage vehicle ───────────────────────────────────────────
        // Load a saved vehicle: switch to its catalog and restore its spec filter.
        async openVehicle(id) {
          let v = null;
          try { v = await Garage.get(id); } catch {}
          if (!v) { this.status = 'Vehicle not found in garage.'; return; }
          this.activeVehicle = v;
          this.partMeta      = v.partMeta || {};
          if (v.catalogId && this.catalogs.some(c => c.id === v.catalogId)) {
            this.catalogId = v.catalogId;
            await this.loadCatalog();   // populates allPrCodes for chip labels
          }
          const s = v.spec || {};
          this.vfYear     = s.vfYear || '';
          this.vfMarket   = s.vfMarket || '';
          this.vfLine     = s.vfLine || '';
          this.vfBody     = s.vfBody || '';
          this.vfDrive    = s.vfDrive || '';
          this.vfTrim     = s.vfTrim || '';
          this.vfEngine   = s.vfEngine || '';
          this.vfGearbox  = s.vfGearbox || '';
          this.vfChassis  = s.vfChassis || '';
          this.vfEngineNo = s.engineNo || '';   // the garage's own key for it
          this.vfPrCodes  = Array.isArray(s.vfPrCodes) ? [...s.vfPrCodes] : [];
          this.prUnknown  = this._unknownPrCodes(this.vfPrCodes);
          if (this.filterActive) this.filterPanelOpen = true;
        },

        clearActiveVehicle() {
          this.activeVehicle = null;
          this.partMeta      = {};
          this.hideOk        = false;
          this.okSectionIds  = new Set();
          this.clearVehicleFilter();
          this._rebuildDisplayRows();
        },

        // ── What the table lists ─────────────────────────────────────
        // Two filters drop rows, and either alone can empty the table. The spec
        // filter drops parts that aren't on this car. Hide Ok drops parts already
        // marked, and sections whose every in-scope part is marked from the sidebar
        // — the "what's left to do" view. Hide-Ok's scope matches the diagram
        // mark-all (sectionOkTargets): the spec filter decides which parts count, so
        // a section of parts that aren't on this car is not "done" and stays listed
        // — the spec filter drops it instead.

        _partVisible(p) {
          if (this.filterActive && !this.partMatchesVehicle(p.applicability, this.currentSectionScope))
            return false;
          return !(this.hideOk && this.vehicleMode && this.partOk(p._key));
        },

        // Rows Hide Ok alone accounts for. A part the spec filter already dropped is
        // not on this car, so counting it here would overstate what the toggle holds
        // back — and the header's "n / m match" already speaks for the spec filter.
        get hiddenOkCount() {
          if (!this.hideOk || !this.vehicleMode) return 0;
          return this.parts.filter(p => this.partOk(p._key) &&
            (!this.filterActive ||
             this.partMatchesVehicle(p.applicability, this.currentSectionScope))).length;
        },

        // Which filter emptied the table. Both can be on; the spec filter is named
        // first because it is the one with nothing to show, not merely hiding.
        get emptyReason() {
          if (this.filterActive && !this.parts.some(p =>
                this.partMatchesVehicle(p.applicability, this.currentSectionScope))) return 'spec';
          return 'ok';
        },

        // The open section always stays listed even once fully marked or filtered
        // out — otherwise ticking its last part, or a keystroke in the filter, would
        // yank the sidebar out from under the user.
        visibleSections(mg) {
          const ok = this.okSectionIds, empty = this.emptySectionIds;
          if (!ok.size && !empty.size) return mg.sections;
          const cur = this.currentSection && this.currentSection.id;
          return mg.sections.filter(s => s.id === cur || !(ok.has(s.id) || empty.has(s.id)));
        },

        // Every section's parts keyed as selectSection keys them (same occurrence
        // counter, same rowid order), so the sidebar rollups can be taken over the
        // whole catalog without loading each section. Built once per catalog, on
        // demand — it is a fact about the catalog, not about the car, so it survives
        // every filter edit.
        //
        // Scopes are parsed here rather than at match time: the rollups re-run on
        // every filter keystroke, and re-parsing 24,000 scopes on each pass is the
        // whole cost of the pass. A section's own scope is parsed once, not once per
        // part in it.
        _sectionPartIndex() {
          if (this._sectionParts) return this._sectionParts;
          const idx = new Map();
          this._sectionParts = idx;
          if (!this.db) return idx;
          let rows = [];
          try {
            rows = this._query(
              `SELECT p.section_id, s.number, p.position, p.part_number,
                      COALESCE(NULLIF(p.applicability, ''), pp.applicability, '') AS appl,
                      s.applicability, s.engine_code, s.gearbox_code, s.body_line, s.body_style,
                      s.drive_code, s.trim_code
               FROM part p JOIN section s ON p.section_id = s.id
               LEFT JOIN part pp ON pp.id = p.parent_id
               WHERE p.catalog_id=? ORDER BY p.section_id, p.rowid`,
              [this.catalogId]
            );
          } catch { return idx; }
          const parse = s => s ? APPL.parse(s, this._index) : null;
          let curSec = null, occurrence = null, list = null, scope = null;
          for (const [sid, snum, position, part_number, applicability, ...scopeCols] of rows) {
            if (sid !== curSec) {
              curSec = sid; occurrence = this._occurrenceCounter(); list = [];
              scope = parse(sectionScope(...scopeCols));
              idx.set(sid, list);
            }
            const n = occurrence(position, part_number);
            list.push({
              key:   this._partKey(snum, position, part_number, n),
              appl:  parse(applicability),
              scope,
            });
          }
          return idx;
        },

        // partMatchesVehicle's rule, on the scopes _sectionPartIndex parsed once.
        _entryMatches(e) {
          if (!this.filterActive) return true;
          return (!e.appl  || APPL.matches(e.appl,  this.vehicleSpec))
              && (!e.scope || APPL.matches(e.scope, this.vehicleSpec));
        },

        // Both sidebar rollups, in one pass over the catalog. A section is dropped
        // when the spec filter admits none of its parts — its table would render
        // empty, so the diagram has nothing on this car — and, under Hide Ok, when
        // every part it does admit is marked.
        //
        // A section the ingest found no parts in is in neither list: nothing was
        // filtered out of it, so hiding it would just be hiding a gap in the data.
        _recomputeSectionRollups() {
          clearTimeout(this._rollupTimer);
          const rollOk = this.hideOk && this.vehicleMode;
          const ok = new Set(), empty = new Set();
          if (this.filterActive || rollOk) {
            for (const [sid, list] of this._sectionPartIndex()) {
              const targets = list.filter(e => this._entryMatches(e));
              // With no spec filter every part is a target, so a list that exists at
              // all has one: `empty` only ever fills while the filter is on.
              if (!targets.length) empty.add(sid);
              else if (rollOk && targets.every(e => this.partOk(e.key))) ok.add(sid);
            }
          }
          this.okSectionIds    = ok;
          this.emptySectionIds = empty;
        },

        // Spec edits land one field at a time — restoring a garage vehicle sets nine
        // in a row, and the year box fires per keystroke — and each rollup is a full
        // catalog pass, so coalesce them into one.
        _scheduleRollups() {
          clearTimeout(this._rollupTimer);
          this._rollupTimer = setTimeout(() => this._recomputeSectionRollups(), 0);
        },

        // Marks change what the filter hides — refresh both views. The sidebar
        // rollup is Hide-Ok's alone to change here: a mark cannot alter which parts
        // the spec filter admits, so with Hide Ok off nothing rebuilds on a click.
        _afterMarkChange() {
          if (!this.hideOk) return;
          this._rebuildDisplayRows();
          this._scheduleRollups();
        },

        // ── Per-part ok / notes (active vehicle only) ────────────────
        // Marks live on the garage vehicle, not the catalog DB — catalog DBs are
        // rebuilt on re-ingest. See Garage.setPartMeta.

        partOk(key)    { return !!(this.partMeta[key] && this.partMeta[key].ok); },
        partNotes(key) { return (this.partMeta[key] && this.partMeta[key].notes) || ''; },

        setPartOk(key, ok) {
          this._applyPartMeta(key, { ok: !!ok });
          this._afterMarkChange();
          this._persistPartMeta(key);
        },

        // ── Mark the whole diagram ───────────────────────────────────
        // Targets every part in the section the vehicle filter admits — marking
        // the physical state of a part that isn't on this car is meaningless.
        // partMatchesVehicle() is true for everything when no filter is set, so
        // with no filter this is simply all parts. Includes parts hidden inside
        // collapsed position groups: the scope is the diagram, not the viewport.
        get sectionOkTargets() {
          if (!this.vehicleMode) return [];
          return this.parts.filter(p => p._key && this.partMatchesVehicle(p.applicability, this.currentSectionScope));
        },

        // The open section's printed scope — what the chips in the header show.
        get currentSectionAppl() {
          return (this.currentSection && this.currentSection.applicability) || '';
        },

        // The open section's full scope, AND-ed into every part match in this section.
        get currentSectionScope() {
          return (this.currentSection && this.currentSection.scope) || '';
        },

        get sectionOkState() {
          const t = this.sectionOkTargets;
          if (!t.length) return 'none';
          const n = t.filter(p => this.partOk(p._key)).length;
          return n === 0 ? 'none' : n === t.length ? 'all' : 'some';
        },

        sectionOkTitle() {
          const t = this.sectionOkTargets;
          if (!t.length) return 'No parts to mark';
          const scope = this.filterActive ? 'matching parts' : 'parts';
          if (this.sectionOkState === 'all') return `Clear Ok on all ${t.length} ${scope} on this diagram`;
          const n = t.filter(p => this.partOk(p._key)).length;
          const done = n ? ` (${n} already marked)` : '';
          return `Mark all ${t.length} ${scope} on this diagram Ok${done}`;
        },

        // All-or-nothing: partially marked ("some") fills the rest in, matching
        // the indeterminate checkbox's affordance.
        toggleSectionOk() {
          const targets = this.sectionOkTargets;
          if (!targets.length) return;
          const ok = this.sectionOkState !== 'all';
          const meta = { ...this.partMeta }, patches = {};
          for (const p of targets) {
            meta[p._key] = { ...(meta[p._key] || { notes: '' }), ok };   // keeps any note
            patches[p._key] = { ok };
          }
          this.partMeta = meta;
          this._afterMarkChange();
          this._persistPartMetaMany(patches);
        },

        // Typing writes through debounced; blur (below) flushes immediately so a
        // note is safe as soon as the user leaves the field.
        setPartNotes(key, notes) {
          this._applyPartMeta(key, { notes });
          clearTimeout(this._noteTimers[key]);
          this._noteTimers[key] = setTimeout(() => this._persistPartMeta(key), 400);
        },

        flushPartNotes(key) {
          if (this._noteTimers[key]) this._persistPartMeta(key);
        },

        _applyPartMeta(key, patch) {
          const cur = this.partMeta[key] || { ok: false, notes: '' };
          this.partMeta = { ...this.partMeta, [key]: { ...cur, ...patch } };
        },

        async _persistPartMeta(key) {
          clearTimeout(this._noteTimers[key]);
          delete this._noteTimers[key];
          const e = this.partMeta[key] || {};
          await this._persistPartMetaMany({ [key]: { ok: !!e.ok, notes: e.notes || '' } });
        },

        async _persistPartMetaMany(patches) {
          if (!this.activeVehicle) return;
          try {
            await Garage.setPartMetaMany(this.activeVehicle.id, patches);
          } catch (err) {
            this.status = 'Could not save mark: ' + err.message;
          }
        },

        // Stable identity for a part row across re-ingest. rowid can't be used —
        // it is reassigned every ingest. Content alone isn't unique either: a
        // section can repeat a row verbatim (997 601-000 lists "Alloy wheel"
        // 997 363 156 05 five times), so disambiguate by occurrence index.
        _partKey(sectionNumber, position, partNumber, n) {
          return [this.catalogId, sectionNumber, position, partNumber, n].join('|');
        },

        // One occurrence counter per section, fed rows in rowid order. Both key
        // producers (selectSection and _sectionPartIndex) go through this: they must
        // number repeats identically or a mark lands on a different part than the one
        // that was ticked.
        _occurrenceCounter() {
          const seen = new Map();
          return (position, partNumber) => {
            const base = position + '|' + partNumber;
            const n = seen.get(base) || 0;
            seen.set(base, n + 1);
            return n;
          };
        },

        // ── Catalog list ─────────────────────────────────────────────

        async listCatalogs() {
          this.catalogs = await CATALOGS.list(this.SQL);
        },

        // ── Load catalog ─────────────────────────────────────────────

        async loadCatalog() {
          if (!this.catalogId) return;
          this.loading = true;
          this.status  = 'Opening database…';
          this.mainGroups     = [];
          this.currentSection = null;
          this.parts          = [];
          this._sectionParts  = null;   // per-catalog; rebuilt on demand
          this._setDiagram(null);

          try {
            const root = await navigator.storage.getDirectory();
            const dir  = await root.getDirectoryHandle(this.catalogId);
            const fh   = await dir.getFileHandle('catalog.sqlite');
            const buf  = await (await fh.getFile()).arrayBuffer();
            this.db    = new this.SQL.Database(new Uint8Array(buf));

            if (!this._schemaCurrent()) {
              this.status = `"${this.catalogId}" doesn't match the current schema — ` +
                            `re-ingest it with tools/ingest.py.`;
              this.db = null;
              return;
            }

            this.loadFacetOptions();   // first: every later parse reads the code index
            this._buildToc();
            this.loadPrCodes();
            this._recomputeSectionRollups();
            this.status = `${this.mainGroups.length} groups, ${this._scalar('SELECT COUNT(*) FROM section')} sections`;
          } catch (e) {
            this.status = 'Error: ' + e.message;
          } finally {
            this.loading = false;
          }
        },

        // ── File-mode loader ─────────────────────────────────────────
        // Fetches a SQLite file from a URL and loads it directly (no OPFS).
        // Diagrams work here too — they ride in section.diagram_blob, so the file
        // is the whole catalog.
        // Usage: viewer.html?sqlite=http://localhost:8080/my-catalog.sqlite

        async loadFromUrl(url) {
          this.loading       = true;
          this.sqliteFileMode = true;
          this.status        = 'Fetching database…';
          this.mainGroups    = [];
          this.currentSection = null;
          this.parts         = [];
          this._sectionParts = null;   // per-catalog; rebuilt on demand
          this._setDiagram(null);
          try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
            const buf  = await resp.arrayBuffer();
            this.db    = new this.SQL.Database(new Uint8Array(buf));
            if (!this._schemaCurrent()) {
              this.status = "This database doesn't match the current schema — re-ingest the catalog.";
              this.db = null;
              return;
            }
            const cat  = this._one('SELECT id, title, model FROM catalog LIMIT 1');
            if (cat) {
              this.catalogId = cat[0];
              this.catalogs  = [{ id: cat[0], label: CATALOGS.label(cat[1], cat[2], cat[0]) }];
            }
            this.loadFacetOptions();
            this._buildToc();
            this.loadPrCodes();
            this._recomputeSectionRollups();
            this.status = `${this.mainGroups.length} groups · ${this._scalar('SELECT COUNT(*) FROM section')} sections (file mode — no diagrams)`;
          } catch (e) {
            this.status = 'Error: ' + e.message;
          } finally {
            this.loading = false;
          }
        },

        // ── Query bridge ──────────────────────────────────────────────
        // Polls the local relay (query-bridge.ps1 / serve.ps1) so SQL
        // queries can be sent from the command line while the viewer is open.

        _startQueryBridge() {
          const self = this;
          const poll = async () => {
            if (self.db) {
              try {
                const r = await fetch('http://localhost:9876/query');
                if (r.ok) {
                  const sql = (await r.text()).trim();
                  if (sql) {
                    let res;
                    if (sql === '__EXPORT__') {
                      const data = self.db.export();
                      let bin = '';
                      for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
                      res = { ok: true, export: btoa(bin), filename: (self.catalogId || 'catalog') + '.sqlite' };
                    } else {
                      try { res = { ok: true, data: self.db.exec(sql) }; }
                      catch (e) { res = { ok: false, error: e.message }; }
                    }
                    await fetch('http://localhost:9876/result', {
                      method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(res),
                    });
                  }
                }
              } catch { /* bridge not running — ignore */ }
            }
            setTimeout(poll, 500);
          };
          poll();
        },

        // ── TOC ──────────────────────────────────────────────────────

        _buildToc() {
          const mgs = this._query(
            'SELECT id, number, title FROM main_group WHERE catalog_id=? ORDER BY CAST(number AS INTEGER)',
            [this.catalogId]
          );
          this.mainGroups = mgs.map(([id, number, title]) => {
            // diagram_blob is deliberately not selected — it would pull every
            // section's G4 bitstream into memory to build a list of titles. Only its
            // presence matters here; selectSection() reads the bytes by id.
            const sections = this._query(
              `SELECT id, number, title, diagram_blob IS NOT NULL, title_remark, title_model,
                      applicability, engine_code, gearbox_code, body_line, body_style, drive_code, trim_code
               FROM section WHERE main_group_id=? ORDER BY number`,
              [id]
            ).map(([sid, snum, stitle, hasDiag, tremark, tmodel, sappl, sec, sgc, sbl, sbs, sdc, stc]) => ({
              id: sid, number: snum, title: stitle, has_diagram: !!hasDiag,
              title_remark: tremark || '', title_model: tmodel || '',
              applicability: sappl || '',
              scope: sectionScope(sappl, sec, sgc, sbl, sbs, sdc, stc),
            }));
            return { id, number, title, open: false, sections };
          });
        },

        // ── Section selection ────────────────────────────────────────

        async selectSection(sec, mg) {
          this.currentSection = sec;
          this.currentMg      = mg;
          this.searchMode     = false;

          // Load parts. Colour/trim variants are child rows (parent_id) that carry no
          // applicability of their own — they inherit the parent block's, so resolve
          // that here rather than letting a child fall through as "applies to all".
          const rows = this._query(
            `SELECT p.rowid, p.position, p.part_number, p.colour_code, p.description,
                    p.quantity, p.remarks,
                    COALESCE(NULLIF(p.applicability, ''), pp.applicability, '') AS appl,
                    p.parent_id
             FROM part p LEFT JOIN part pp ON pp.id = p.parent_id
             WHERE p.section_id=? ORDER BY p.rowid`,
            [sec.id]
          );
          const occurrence = this._occurrenceCounter();
          this.parts = rows.map(([rowid, position, part_number, colour_code, description,
                                  quantity, remarks, applicability, parent_id]) => {
            const n = occurrence(position, part_number);
            return {
              _rowid: rowid, _key: this._partKey(sec.number, position, part_number, n),
              _parentId: parent_id ?? null,
              position, part_number, colour_code: colour_code || '',
              description, quantity, remarks,
              applicability: applicability || '',
            };
          });
          this.posGroups = this._buildPosGroups(this.parts);
          this._rebuildDisplayRows();

          // Load callouts
          this.callouts = this._query(
            'SELECT number, x0, y0, x1, y1, confidence FROM callout WHERE section_id=?',
            [sec.id]
          ).map(([number, x0, y0, x1, y1, confidence]) => ({ number, x0, y0, x1, y1, confidence }));
          this.hoveredPos  = null;
          this.selectedPos = null;

          // Load diagram. It travels inside the DB (CCITT G4 bitstream), so this works
          // in file mode too. Decode happens here, only for the section being shown.
          this._setDiagram(null);
          const token = ++this._diagramToken;
          if (sec.has_diagram) {
            const row = this._query(
              'SELECT diagram_blob, diagram_w, diagram_h FROM section WHERE id=?', [sec.id]
            )[0];
            if (row && row[0]) this._showG4Diagram(row[0], row[1], row[2], token);
          }
        },

        // ── Search ───────────────────────────────────────────────────

        // Both paths select the same scope the section list does, so a hit carries
        // its vehicle match with it — search is a way into the catalog, not a way
        // around the filter.
        search() {
          const q = this.query.trim();
          if (!q || !this.db) { this.searchMode = false; return; }
          this.searchMode = true;

          const COLS =
            `SELECT p.position, p.part_number, p.description, p.quantity, p.remarks,
                    s.number, p.section_id,
                    COALESCE(NULLIF(p.applicability,''), pp.applicability, '') AS appl,
                    s.applicability, s.engine_code, s.gearbox_code, s.body_line, s.body_style,
                    s.drive_code, s.trim_code`;
          // Colour/trim variants are child rows whose scope lives on the parent block.
          const JOINS =
            `FROM part p
             JOIN section s ON p.section_id = s.id
             LEFT JOIN part pp ON pp.id = p.parent_id`;

          // Try FTS4 first, fall back to LIKE
          let rows;
          try {
            rows = this._query(
              `${COLS} ${JOINS} JOIN part_fts ON part_fts.docid = p.id
               WHERE part_fts MATCH ? AND p.catalog_id = ? LIMIT 200`,
              [ftsPrefixQuery(q), this.catalogId]
            );
          } catch {
            rows = this._query(
              `${COLS} ${JOINS}
               WHERE p.catalog_id=? AND (p.part_number LIKE ? OR p.description LIKE ?) LIMIT 200`,
              [this.catalogId, `%${q}%`, `%${q}%`]
            );
          }
          // The scope travels with the row rather than the verdict: the filter can
          // change while results are up, and re-running the query to redraw them
          // would throw away the user's scroll position.
          this.searchResults = rows.map(
            ([position, part_number, description, quantity, remarks, section_number, section_id,
              applicability, ...scopeCols]) => ({
              position, part_number, description, quantity, remarks, section_number, section_id,
              applicability: applicability || '', _scope: sectionScope(...scopeCols),
            })
          );
        },

        get searchMatchCount() {
          return this.searchResults.filter(r => this.partMatchesVehicle(r.applicability, r._scope)).length;
        },

        clearSearch() {
          this.query        = '';
          this.searchMode   = false;
          this.searchResults = [];
        },

        // ── Applicability ────────────────────────────────────────────

        // The stored form is spaced ("D - MJ 2008>>"), so scan for whole shapes
        // rather than splitting on whitespace — "MJ" and "2008>>" are one chip.
        parseAppl(str) {
          if (!str) return [];
          const SHAPE = /PR:[\w,-]+|MJ\s*\d{4}(?:\s*>>)?/gi;
          return str.split(' | ').flatMap(seg => {
            const chips = [];
            const push  = (text, type) => { text = text.trim(); if (text) chips.push({ text, type }); };
            let rest = seg.trim();
            // Leading market letter: "D - MJ 2008>>", "F >> 99-9S770 428 lhd"
            const mkt = rest.match(/^([A-Z]{1,3})\s+(?=-|>>|MJ\b)/);
            if (mkt) { push(mkt[1], 'dest'); rest = rest.slice(mkt[0].length); }
            let last = 0;
            for (const m of rest.matchAll(SHAPE)) {
              push(rest.slice(last, m.index), 'other');
              push(m[0], /^PR:/i.test(m[0]) ? 'pr' : 'mj');
              last = m.index + m[0].length;
            }
            push(rest.slice(last), 'other');
            return chips;
          });
        },

        async jumpToSection(result) {
          // Find and open the section in the sidebar
          for (const mg of this.mainGroups) {
            const sec = mg.sections.find(s => s.id === result.section_id);
            if (sec) {
              mg.open = true;
              await this.selectSection(sec, mg);
              this.clearSearch();
              return;
            }
          }
        },

        // ── Callout overlay ──────────────────────────────────────────

        onDiagramLoad() {
          const img = document.querySelector('.diagram-wrap img');
          if (!img) return;
          const natW = img.naturalWidth, natH = img.naturalHeight;
          if (!natW || !natH) return;
          // Defer to rAF so x-show has finished making the element visible and the
          // browser has completed a layout pass — offsetWidth/Height return 0 otherwise.
          requestAnimationFrame(() => this._positionCanvas());
        },

        _positionCanvas() {
          const img = document.querySelector('.diagram-wrap img');
          const cvs = document.getElementById('callout-canvas');
          if (!img || !cvs) return;
          const natW = img.naturalWidth, natH = img.naturalHeight;
          if (!natW || !natH) return;
          // img fills diagram-wrap via object-fit:contain with letterboxing.
          // Position the canvas over exactly the rendered image region.
          const boxW = img.offsetWidth, boxH = img.offsetHeight;
          if (!boxW || !boxH) return;
          const scale = Math.min(boxW / natW, boxH / natH);
          const rendW = Math.round(natW * scale);
          const rendH = Math.round(natH * scale);
          cvs.style.left   = Math.round((boxW - rendW) / 2) + 'px';
          cvs.style.top    = Math.round((boxH - rendH) / 2) + 'px';
          cvs.style.width  = rendW + 'px';
          cvs.style.height = rendH + 'px';
          cvs.width  = rendW;
          cvs.height = rendH;
          this.drawCallouts();
        },

        // A callout stands for the parts at its position. It belongs on this car only
        // if one of them does — a GT2-only callout has no business highlighting on a
        // Turbo. A callout OCR read at a position the text never lists (90 of 5,000)
        // answers to no part, so nothing is known against it and it stays.
        get visibleCallouts() {
          if (!this.filterActive) return this.callouts;
          const byPos = new Map();
          for (const p of this.parts) {
            const n = this._posNum(p.position);
            if (n === null) continue;
            byPos.set(n, (byPos.get(n) || false) ||
                         this.partMatchesVehicle(p.applicability, this.currentSectionScope));
          }
          return this.callouts.filter(c => byPos.get(c.number) !== false);
        },

        drawCallouts() {
          const cvs = document.getElementById('callout-canvas');
          if (!cvs) return;
          const ctx = cvs.getContext('2d');
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          const callouts = this.visibleCallouts;
          if (!callouts.length) return;
          const W = cvs.width, H = cvs.height;
          const PAD = 3;
          for (const c of callouts) {
            const x0 = c.x0 / 10000 * W - PAD, y0 = c.y0 / 10000 * H - PAD;
            const bw  = (c.x1 - c.x0) / 10000 * W + PAD * 2, bh = (c.y1 - c.y0) / 10000 * H + PAD * 2;
            const sel = c.number === this.hoveredPos || c.number === this.selectedPos;
            if (sel) {
              ctx.shadowColor  = 'rgba(255,160,0,0.9)';
              ctx.shadowBlur   = 8;
              ctx.strokeStyle  = '#ff9800';
              ctx.lineWidth    = 3;
              ctx.strokeRect(x0, y0, bw, bh);
              ctx.shadowBlur   = 0;
              ctx.fillStyle    = 'rgba(255,152,0,0.28)';
              ctx.fillRect(x0, y0, bw, bh);
            } else {
              ctx.shadowBlur   = 0;
              ctx.strokeStyle  = 'rgba(76,175,80,0.65)';
              ctx.lineWidth    = 1.5;
              ctx.strokeRect(x0, y0, bw, bh);
            }
          }
        },

        diagramClick(e) {
          const cvs = document.getElementById('callout-canvas');
          const callouts = this.visibleCallouts;
          if (!cvs || !callouts.length) return;
          const r = cvs.getBoundingClientRect();
          const x = (e.clientX - r.left)  / r.width;
          const y = (e.clientY - r.top)   / r.height;
          const hit = callouts.find(c =>
            x >= c.x0/10000 && x <= c.x1/10000 &&
            y >= c.y0/10000 && y <= c.y1/10000
          );
          if (!hit) return;
          this.hoveredPos  = hit.number;
          this.selectedPos = hit.number;
          const gi = this.posGroups.findIndex(g => g.basePos === hit.number);
          if (gi >= 0 && !this.posGroups[gi].expanded) {
            this.posGroups[gi].expanded = true;
            this._rebuildDisplayRows();
          }
          const row = document.querySelector(`tr[data-pos-num="${CSS.escape(hit.number)}"]`);
          if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        },

        _setDiagram(url) {
          if (this.diagramUrl) URL.revokeObjectURL(this.diagramUrl);
          this.diagramUrl = url;
        },

        // Decode a section's CCITT G4 bitstream to a displayable image. toBlob is
        // async, so a token guards against a slow decode clobbering a newer section.
        _showG4Diagram(bytes, w, h, token) {
          try {
            const { pixels } = CCITT.decode(bytes, w, h);
            const rgba = CCITT.toRGBA(pixels, w, h);
            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            cvs.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);
            cvs.toBlob(b => {
              if (!b || token !== this._diagramToken) return;
              this._setDiagram(URL.createObjectURL(b));
            }, 'image/png');
          } catch (e) {
            console.error('diagram G4 decode failed', e);
          }
        },

        // Extract numeric part of a position for callout matching.
        // '5' → '5', '(5)' → '5', '-' → null, '' → null
        _posNum(pos) {
          if (!pos || pos === '-') return null;
          const m = pos.match(/^\(?(\d+)\)?$/);
          return m ? m[1] : null;
        },

        // ── Position grouping ────────────────────────────────────────
        // Groups collapse to their head row with a ▶ expander. Two things join a
        // group: a shared position number, and a colour/trim variant joining its
        // parent block (variants carry no position of their own).
        //
        // Built from every part in the section, never the filtered subset: grouping
        // is a fact about the catalog, not about the car. So a variant stays with its
        // block even when the filter drops the parent row — a variant that carries
        // its own scope can outlive its parent — and expand state survives a filter
        // edit for free. _rebuildDisplayRows() does the dropping.
        _buildPosGroups(parts) {
          const groups = [];
          const byBase = new Map();
          const byId   = new Map();   // part rowid -> group index
          for (const p of parts) {
            if (p._parentId !== null && byId.has(p._parentId)) {
              groups[byId.get(p._parentId)].parts.push(p);
              continue;
            }
            const base = this._posNum(p.position);
            let gi;
            if (base !== null && byBase.has(base)) {
              gi = byBase.get(base);
              groups[gi].parts.push(p);
            } else {
              gi = groups.length;
              if (base !== null) byBase.set(base, gi);
              groups.push({ basePos: base, posLabel: p.position, parts: [p], expanded: false });
            }
            byId.set(p._rowid, gi);
          }
          return groups;
        },

        // Rebuild the flat display list from posGroups. A filtered part is dropped
        // outright, not greyed, so a group's head is its first *surviving* part and a
        // group the filter empties disappears with its parts. Call after any
        // expand/collapse or filter change.
        _rebuildDisplayRows() {
          const rows = [];
          for (let gi = 0; gi < this.posGroups.length; gi++) {
            const g = this.posGroups[gi];
            const shown = g.parts.filter(p => this._partVisible(p));
            for (let pi = 0; pi < shown.length; pi++) {
              if (pi > 0 && !g.expanded) break;
              rows.push({
                part:      shown[pi],
                _rowid:    shown[pi]._rowid,
                _gi:       gi,
                _pi:       pi,
                _isHead:   pi === 0,
                _hasMore:  pi === 0 && shown.length > 1,
                _expanded: g.expanded,
                _basePos:  g.basePos,
                // A promoted head is a colour/trim variant, which carries no position
                // of its own. It still sits at its block's callout, so show the
                // block's number rather than heading the group with a blank cell.
                _posText:  pi === 0 ? (shown[pi].position || g.posLabel) : shown[pi].position,
              });
            }
          }
          this.displayRows = rows;
        },

        toggleGroup(gi) {
          this.posGroups[gi].expanded = !this.posGroups[gi].expanded;
          this._rebuildDisplayRows();
        },

        // ── Vehicle filter ────────────────────────────────────────────

        loadPrCodes() {
          try {
            this.allPrCodes = this._query(
              'SELECT code, description FROM pr_code WHERE catalog_id=? ORDER BY CAST(code AS INTEGER)=0, CAST(code AS INTEGER), code',
              [this.catalogId]
            ).map(([code, description]) => ({ code, description }));
          } catch { this.allPrCodes = []; }
        },

        // Every facet the user can set is offered from the catalog's own vocabulary:
        // a fixed list would be wrong for the next model line, and a value no part
        // carries can only hide the whole catalog. Codes get a readable label —
        // "G9750" alone tells the owner of a 6-speed car nothing.
        loadFacetOptions() {
          this.engineOptions  = [];
          this.gearboxOptions = [];
          this.lineOptions    = [];
          this.bodyOptions    = [];
          this.marketOptions  = [];
          this._vinRanges       = [];
          this._engineNumRanges = [];
          try {
            // A code appears once per date range; the x-for is keyed on the code,
            // and a duplicate key makes Alpine drop the whole option list.
            const uniq = list => { const seen = new Set();
              return list.filter(o => !seen.has(o.code) && seen.add(o.code)); };
            this.engineOptions = uniq(this._query(
              `SELECT ec, displacement_l, power_hp FROM engine_code WHERE catalog_id=? ORDER BY ec`,
              [this.catalogId]
            ).map(([ec, disp, hp]) => ({ code: ec, label: engineLabel(ec, disp, hp) })));
            this.gearboxOptions = uniq(this._query(
              `SELECT tc, type_code FROM transmission_code WHERE catalog_id=? ORDER BY tc`,
              [this.catalogId]
            ).map(([tc, type]) => ({ code: tc, label: gearboxLabel(tc, type) })));

            // The typed section columns are OR-lists ("TURBO,GT2"); a section scoped
            // to either offers both, not the pair.
            const split = col => [...new Set(this._query(
              `SELECT DISTINCT ${col} FROM section WHERE catalog_id=? AND COALESCE(${col},'')!=''`,
              [this.catalogId]
            ).flatMap(([v]) => v.split(',')).map(v => v.trim()).filter(Boolean))].sort();
            this.lineOptions = split('body_line');
            this.bodyOptions = split('body_style');
            this.driveOptions = split('drive_code');
            this.trimOptions  = split('trim_code');

            // The full parser dictionary — the same APPL.buildIndex the ingest worker
            // used, rebuilt here from the catalog's own tables so the viewer decodes a
            // part's scope exactly as ingest typed the sections. dialect and year_pivot
            // were detected once at ingest and stored on the catalog row; they gate the
            // old-dialect forms (bare option codes, parenthesised markets, 2-digit
            // years) so the modern dialect is untouched.
            const meta = this._one('SELECT dialect, year_pivot FROM catalog LIMIT 1') || [];
            this.dialect   = meta[0] || 'modern';
            this.yearPivot = meta[1] || null;
            this._index = APPL.buildIndex({
              engineCodes: this.engineOptions.map(e => ({ ec: e.code })),
              transmCodes: this.gearboxOptions.map(g => ({ tc: g.code })),
              prCodes:     this._query('SELECT code FROM pr_code WHERE catalog_id=?', [this.catalogId]).map(([code]) => ({ code })),
              salesTypes:  this._query('SELECT description FROM sales_type WHERE catalog_id=?', [this.catalogId]).map(([description]) => ({ description })),
              vinRanges:   this._query('SELECT remark FROM vin_range WHERE catalog_id=?', [this.catalogId]).map(([remark]) => ({ remark })),
              vehicleTypes: this._query(
                `SELECT vehicle_type FROM engine_number_range WHERE catalog_id=?
                 UNION SELECT vehicle_type FROM transmission_number_range WHERE catalog_id=?`,
                [this.catalogId, this.catalogId]).map(([v]) => v).filter(Boolean),
              dialect:     this.dialect,
              yearPivot:   this.yearPivot,
            });

            // The number blocks a chassis/engine/transmission breakpoint is read
            // against. Each table was write-only until the viewer resolved a car.
            this._vinRanges = this._query(
              `SELECT vin_from, vin_to FROM vin_range WHERE catalog_id=?`, [this.catalogId]
            ).map(([from, to]) => ({ from, to }));
            this._engineNumRanges = this._query(
              `SELECT number_from, number_to FROM engine_number_range WHERE catalog_id=?`,
              [this.catalogId]
            ).map(([from, to]) => ({ from, to }));
            this._transmissRanges = this._query(
              `SELECT number_from, number_to FROM transmission_number_range WHERE catalog_id=?`,
              [this.catalogId]
            ).map(([from, to]) => ({ from, to }));

            // Market is free text, not a picker: the codes below are the ones the
            // catalog gates parts ON, but a car's own market is usually not among
            // them — a USA car must still be able to say "USA" to drop the parts
            // printed only for '"ROK"'.
            this.marketOptions = [...new Set(
              this._query(
                `SELECT applicability FROM part WHERE catalog_id=? AND applicability LIKE '%"%'
                 UNION SELECT applicability FROM section WHERE catalog_id=? AND applicability LIKE '%"%'`,
                [this.catalogId, this.catalogId]
              ).flatMap(([a]) => {
                const p = APPL.parse(a, this._index);
                return [...p.markets.any, ...p.markets.not];
              })
            )].sort();
          } catch { this._index = null; }
        },

        // The selected codes with the catalog's labels, in the option list's own
        // order (numeric codes first, then M-numbers alphabetically) so a code can
        // be found by eye rather than by paste order. `unknown` only means anything
        // once the catalog's list is loaded — before that, nothing is flagged.
        get selectedPrItems() {
          const desc = new Map(this.allPrCodes.map(p => [p.code, p.description]));
          const num = c => /^\d+$/.test(c) ? parseInt(c, 10) : Infinity;
          return [...this.vfPrCodes]
            .sort((a, b) => num(a) - num(b) || a.localeCompare(b))
            .map(code => ({ code, desc: desc.get(code) || '',
                            unknown: desc.size > 0 && !desc.has(code) }));
        },

        updatePrDropdown() {
          const q = this.prSearch.trim().toLowerCase();
          this.prDropdownItems = (q
            ? this.allPrCodes.filter(p =>
                p.code.toLowerCase().includes(q) || p.description.toLowerCase().includes(q))
            : this.allPrCodes
          ).filter(p => !this.vfPrCodes.includes(p.code));
        },

        addPrCode(code) {
          if (!this.vfPrCodes.includes(code)) this.vfPrCodes = [...this.vfPrCodes, code];
          this.prSearch = '';
          this.prDropdownOpen = false;
          this.prDropdownItems = [];
        },

        // Enter in the add box: commit typed/pasted codes. A single token prefers an
        // exact code match, then the top filtered suggestion; multiple tokens are a
        // pasted option-sticker (Kardex) list.
        commitPrEntry() {
          const raw = this.prSearch.trim();
          if (!raw) return;
          const tokens = raw.split(/[\s,;/|]+/).filter(Boolean);
          if (tokens.length === 1) {
            const tok = tokens[0].toUpperCase();
            const exact = this.allPrCodes.find(p => p.code.toUpperCase() === tok);
            if (exact) { this.prUnknown = []; this.addPrCode(exact.code); return; }
            if (this.prDropdownItems.length) { this.prUnknown = []; this.addPrCode(this.prDropdownItems[0].code); return; }
          }
          this.addPrCodesBulk(tokens);
        },

        // Add every entered code, and say which ones this catalog's option list does
        // not describe. Dropping them would be the wrong call twice over: the codes
        // are the car's, not the catalog's, and PR codes and M-numbers are ONE
        // vocabulary here — a sticker's M-numbers gate real parts (997 300 020 50,
        // the 6-speed gearbox itself, is 'G9750+ PR:220'). An unlabelled code can
        // only ever admit more parts, so carrying it is safe; swallowing it is not.
        addPrCodesBulk(tokens) {
          const toAdd = [];
          for (const t of tokens) {
            const code = (this.allPrCodes.find(p => p.code.toUpperCase() === t.toUpperCase()) || {}).code
                         || t.toUpperCase();
            if (!this.vfPrCodes.includes(code) && !toAdd.includes(code)) toAdd.push(code);
          }
          if (toAdd.length) this.vfPrCodes = [...this.vfPrCodes, ...toAdd];
          this.prUnknown = this._unknownPrCodes(this.vfPrCodes);
          this.prSearch = '';
          this.prDropdownOpen = false;
          this.prDropdownItems = [];
        },

        _unknownPrCodes(codes) {
          const known = new Set(this.allPrCodes.map(p => p.code.toUpperCase()));
          return codes.filter(c => !known.has(String(c).toUpperCase()));
        },

        removePrCode(code) {
          this.vfPrCodes = this.vfPrCodes.filter(p => p !== code);
          this.prUnknown = this._unknownPrCodes(this.vfPrCodes);
        },

        clearVehicleFilter() {
          this.vfYear = ''; this.vfMarket = ''; this.vfPrCodes = [];
          this.vfLine = ''; this.vfBody = ''; this.vfDrive = ''; this.vfTrim = '';
          this.vfEngine = ''; this.vfGearbox = '';
          this.vfChassis = ''; this.vfEngineNo = '';
          this.prSearch = ''; this.prDropdownOpen = false; this.prUnknown = [];
        },

        // ── VIN decode ────────────────────────────────────────────────
        // Scan every ingested catalog's vin_range once and cache it. Reuses the
        // already-open db for the current catalog; opens/closes the rest.
        async _loadVinIndex() {
          // Don't keep an empty cache: a decode can fire before listCatalogs() fills the list.
          if (this._vinIndex && this._vinIndex.length) return this._vinIndex;
          const idx = [];
          const add = (db, catalogId) => {
            let res;
            try { res = db.exec('SELECT model_year, vin_from, vin_to, remark FROM vin_range'); }
            catch { return; }
            for (const [modelYear, from, to, remark] of (res[0]?.values ?? []))
              idx.push({ catalogId, modelYear, from, to, remark });
          };
          if (this.sqliteFileMode || !navigator.storage?.getDirectory) {
            if (this.db) add(this.db, this.catalogId || '(file)');
          } else {
            const root = await navigator.storage.getDirectory();
            for (const c of this.catalogs) {
              if (c.id === this.catalogId && this.db) { add(this.db, c.id); continue; }
              let db = null;
              try {
                const dir = await root.getDirectoryHandle(c.id);
                const fh  = await dir.getFileHandle('catalog.sqlite');
                const buf = await (await fh.getFile()).arrayBuffer();
                db = new this.SQL.Database(new Uint8Array(buf));
                add(db, c.id);
              } catch { /* skip unreadable catalog */ }
              finally { if (db) db.close(); }
            }
          }
          this._vinIndex = idx;
          return idx;
        },

        async decodeVin() {
          const dec = VIN.decodeVin(this.vinInput);
          if (!dec.ok) { this.vinResult = { error: dec.error }; return; }
          const idx     = await this._loadVinIndex();
          const matches = dec.chassis ? VIN.matchChassis(dec.chassis, idx) : [];
          this.vinResult = { ...dec, matches };
          if (matches.length) await this.applyVinMatch(matches[0]);
        },

        // Fill in what the VIN's own vin_range row says about the car. Only blank
        // fields are touched — a decode must never quietly overwrite what the owner
        // typed, and everything here is a prefill the owner can correct.
        async applyVinMatch(m) {
          if (m.catalogId && m.catalogId !== this.catalogId && !this.sqliteFileMode) {
            this.catalogId = m.catalogId;
            await this.loadCatalog();
          }
          this.filterPanelOpen = true;
          if (m.modelYear) this.vfYear = String(m.modelYear);
          // Only this catalog's ranges: the body style read from what the remarks
          // never name is only true within one catalog's own naming.
          const remarks = (this._vinIndex || []).filter(r => r.catalogId === m.catalogId)
                                                .map(r => r.remark);
          const f = VIN.variantFacets(m.remark, remarks, this.lineOptions, this.bodyOptions);
          if (!this.vfLine   && f.line)   this.vfLine   = f.line;
          if (!this.vfBody   && f.body)   this.vfBody   = f.body;
          if (!this.vfMarket && f.market) this.vfMarket = f.market;
          // The VIN reconstructs the chassis number the breakpoints are printed
          // against — the one facet here the decode knows exactly.
          if (!this.vfChassis && this.vinResult && this.vinResult.chassis)
            this.vfChassis = this.vinResult.chassis;
          this.vinResult = { ...this.vinResult, applied: m };
        },

        vinSummary() {
          const r = this.vinResult;
          if (!r) return '';
          if (r.error) return r.error;
          const fam = (r.family || 'unknown').toUpperCase();
          const my  = r.modelYear ? `MJ ${r.modelYear}` : (r.yearChar || '?');
          const ms  = r.matches || [];
          if (!ms.length) return `${fam} · ${my} · ${r.chassis || '?'} — no catalog match`;
          const pm      = VIN.parseMarket(ms[0].remark);
          const variant = pm.variant || ms[0].remark || '';
          const mkt     = pm.marketLabel ? ` · ${pm.marketLabel}` : '';
          const extra   = ms.length > 1 ? ` (+${ms.length - 1})` : '';
          return `${fam} · ${my} · ${variant}${mkt}${extra} → ${ms[0].catalogId}`;
        },

        // A part is admitted only if BOTH its own scope and its section's scope admit
        // the car — 15 sections are gated by a PR code on their title row, 20 carry a
        // section-level model-year scope, and 57 more are typed to an engine, gearbox,
        // model line or body style. The two are evaluated separately and AND-ed rather
        // than concatenated: a part and its section each state their own year window,
        // and OR-ing two windows into one alternative list would let the section's
        // window satisfy a part printed for different years. AND-ing the booleans is
        // the actual intersection.
        partMatchesVehicle(applStr, sectionScope) {
          if (!this.filterActive) return true;
          return this._matchesAppl(applStr) && this._matchesAppl(sectionScope);
        },

        _matchesAppl(applStr) {
          if (!applStr) return true;
          return APPL.matches(APPL.parse(applStr, this._index), this.vehicleSpec);
        },

        // The car, in the facets the grammar speaks. A blank field is not a filter:
        // APPL never rejects on a fact we do not know about the car.
        //
        // Rebuilt only when the spec changes. A full catalog pass calls this 24,000
        // times, and reading vfPrCodes — a reactive array — into a fresh Set on each
        // one costs an order of magnitude more than every parse and match together.
        // The codes are replaced wholesale on every edit, never mutated in place, so
        // the array's identity is a sound cache key.
        get vehicleSpec() {
          const codes = this.vfPrCodes;
          const s = this._spec;
          if (s && s._codes === codes && s.year === this.vfYear && s.market === this.vfMarket &&
              s.line === this.vfLine && s.body === this.vfBody &&
              s.drive === this.vfDrive && s.trim === this.vfTrim &&
              s.engine === this.vfEngine && s.gearbox === this.vfGearbox &&
              s.chassis === this.vfChassis && s.engineNum === this.vfEngineNo) return s;
          return (this._spec = {
            line:    this.vfLine,
            body:    this.vfBody,
            drive:   this.vfDrive,
            trim:    this.vfTrim,
            engine:  this.vfEngine,
            gearbox: this.vfGearbox,
            // A breakpoint only speaks about cars in its own number block, so the
            // car's block travels with it. Resolved from the catalog's own tables:
            // the same serial names a different car in each block, and comparing
            // across them is how "up to 780473" comes to hide a 784090 USA car
            // that the changeover never touched.
            chassis:        this.vfChassis,
            chassisBlock:   this._numberBlock(this._vinRanges, this.vfChassis),
            engineNum:      this.vfEngineNo,
            engineNumBlock: this._numberBlock(this._engineNumRanges, this.vfEngineNo),
            // The market the year segment leads with ("D - MJ 2008>>") is only ever
            // D or absent, so it says nothing and APPL does not enforce it. This is
            // the QUOTED market code ('"ROK"', '-"CN."'), which genuinely splits
            // parts — 601-005 lists a Korea and a non-Korea version of one part.
            market:  this.vfMarket,
            year:    this.vfYear,
            _codes:  codes,
            prCodes: new Set(codes),
          });
        },

        // The row of a number table whose span contains this serial — the block the
        // catalog itself put the car in. Ranges are keyed on the prefix as well as
        // the number: a MY2008 chassis and a MY2009 one can share a serial.
        _numberBlock(rows, value) {
          if (!value || !rows || !rows.length) return null;
          const k = APPL.serialKey(value);
          if (!k) return null;
          return rows.find(r => {
            const lo = APPL.serialKey(r.from);
            if (!lo || lo.prefix !== k.prefix) return false;
            const hi  = APPL.serialKey(r.to);
            const top = (hi && hi.prefix === k.prefix) ? hi.serial : lo.serial;
            return k.serial >= lo.serial && k.serial <= top;
          }) || null;
        },

        // ── SQL helpers ───────────────────────────────────────────────

        // A DB that doesn't match the schema throws "no such column" deep inside
        // _buildToc, so check up front and say what to do about it instead.
        _schemaCurrent() {
          return SCHEMA.matches(this.SQL, this.db);
        },

        _query(sql, params = []) {
          const result = this.db.exec(sql, params);
          return result[0]?.values ?? [];
        },
        _one(sql, params = []) {
          return this._query(sql, params)[0] ?? null;
        },
        _scalar(sql, params = []) {
          return this._one(sql, params)?.[0] ?? null;
        },
      };
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js" defer></script>
