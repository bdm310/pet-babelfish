<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spike: Applicability Format</title>
  <style>
    body { font-family: monospace; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #fff; font-size: 1.2rem; }
    p { color: #aaa; font-size: 0.9rem; }
    #dropzone { border: 2px dashed #555; border-radius: 8px; padding: 2rem; text-align: center; color: #888; cursor: pointer; }
    #dropzone.over { border-color: #4caf50; color: #4caf50; }
    #controls { display: none; margin-top: 1rem; gap: 0.5rem; flex-wrap: wrap; }
    button { background: #333; color: #e0e0e0; border: 1px solid #555; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.85rem; }
    button:hover { background: #444; }
    #output { margin-top: 1rem; }
    .section { margin-top: 1.5rem; }
    .section h2 { font-size: 1rem; color: #ccc; border-bottom: 1px solid #333; padding-bottom: 0.4rem; }
    .stat { display: inline-block; background: #2a2a2a; border: 1px solid #444; border-radius: 3px; padding: 0.2rem 0.5rem; margin: 0.2rem; font-size: 0.8rem; }
    .stat.ok { border-color: #4caf50; color: #4caf50; }
    .stat.warn { border-color: #ff9800; color: #ff9800; }
    .stat.hi { border-color: #2196f3; color: #2196f3; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { background: #2a2a2a; color: #888; padding: 0.3rem 0.5rem; text-align: left; border-bottom: 1px solid #333; }
    td { padding: 0.25rem 0.5rem; border-bottom: 1px solid #222; vertical-align: top; }
    tr:hover td { background: #222; }
    .bar { display: inline-block; height: 10px; background: #4caf50; opacity: 0.7; vertical-align: middle; }
    progress { width: 100%; height: 6px; }
    .token-grid { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.5rem 0; }
    .token { padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.85rem; border: 1px solid #444; }
    .token.keyword { border-color: #4caf50; background: rgba(76,175,80,0.1); }
    .token.mcode { border-color: #2196f3; background: rgba(33,150,243,0.1); }
    .token.year { border-color: #ff9800; background: rgba(255,152,0,0.1); }
  </style>
</head>
<body>
  <h1>Spike 4 — Applicability Format</h1>
  <p>Drop a catalog PDF. Extracts the text following every part number and analyzes the vocabulary used in the applicability/remarks columns to determine if a structured parser is feasible.</p>

  <div id="dropzone">
    Drop PDF here, or click to select
    <input type="file" id="fileInput" accept=".pdf" style="display:none">
  </div>

  <div id="controls">
    <button onclick="runAnalysis()">Analyze applicability tokens</button>
    <button onclick="showRawLines()">Show raw part-number lines</button>
    <button onclick="showParsedExamples()">Show parsed examples</button>
  </div>

  <div id="output"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDFJS_OPTS = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
    };

    let pdfDoc = null;
    let allLines = []; // { pageNum, line, partNumber, tail }

    // Matches "997 361 701 00", "7PP 010 707 K", etc. — alphanumeric first group, digit middle groups
    const PART_NUM_RE = /[A-Z0-9]{2,4}(\s[0-9]{3}){2,3}(\s[0-9A-Z]{2,3})?/;

    // Known German PET applicability vocabulary
    const KEYWORDS = {
      'ab': 'from (Mj/date)',
      'bis': 'until (Mj/date)',
      'Mj': 'model year (Modelljahr)',
      'nur': 'only',
      'mit': 'with',
      'ohne': 'without',
      'für': 'for',
      'nicht': 'not',
      'alle': 'all',
      'und': 'and',
      'oder': 'or',
      'inkl': 'including',
      'exkl': 'excluding',
    };

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

    async function loadFile(file) {
      if (!file) return;
      dropzone.textContent = `Loading ${file.name}…`;
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf, ...PDFJS_OPTS }).promise;
      dropzone.textContent = `✓ ${file.name} — ${pdfDoc.numPages} pages`;
      document.getElementById('controls').style.display = 'flex';
      output.innerHTML = '';
      allLines = [];
    }

    async function collectLines() {
      if (allLines.length > 0) return;
      output.innerHTML = '<progress id="p"></progress><span style="color:#888">Scanning pages…</span>';
      const prog = document.getElementById('p');
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();

        // Reconstruct lines by grouping items with similar y
        const items = content.items.filter(it => it.str && it.str.trim());
        const lineMap = {};
        for (const it of items) {
          const y = Math.round(it.transform[5]);
          if (!lineMap[y]) lineMap[y] = [];
          lineMap[y].push({ x: it.transform[4], str: it.str });
        }
        const lines = Object.values(lineMap)
          .map(group => group.sort((a, b) => a.x - b.x).map(g => g.str).join(' '));

        for (const line of lines) {
          const m = line.match(PART_NUM_RE);
          if (!m) continue;
          const tail = line.slice(line.indexOf(m[0]) + m[0].length).trim();
          allLines.push({ pageNum: i, line, partNumber: m[0], tail });
        }
        if (prog) prog.value = i / pdfDoc.numPages;
      }
    }

    async function runAnalysis() {
      await collectLines();

      const tokenCounts = {};
      const mCodeCounts = {};
      const yearCounts = {};
      let tailsWithContent = 0;

      for (const { tail } of allLines) {
        if (!tail) continue;
        tailsWithContent++;
        const tokens = tail.split(/[\s,;/]+/).filter(Boolean);
        for (const tok of tokens) {
          // M-codes: M followed by digits
          if (/^M\d{3,4}$/.test(tok)) {
            mCodeCounts[tok] = (mCodeCounts[tok] || 0) + 1;
            continue;
          }
          // Years: 2-digit or 4-digit years
          if (/^(19|20)\d{2}$/.test(tok) || /^\d{2}$/.test(tok)) {
            yearCounts[tok] = (yearCounts[tok] || 0) + 1;
            continue;
          }
          tokenCounts[tok] = (tokenCounts[tok] || 0) + 1;
        }
      }

      const maxTok = Math.max(...Object.values(tokenCounts), 1);
      const topTokens = Object.entries(tokenCounts).sort((a, b) => b[1] - a[1]).slice(0, 60);
      const topMCodes = Object.entries(mCodeCounts).sort((a, b) => b[1] - a[1]).slice(0, 20);
      const topYears = Object.entries(yearCounts).sort((a, b) => b[1] - a[1]).slice(0, 20);

      let html = `<div class="section"><h2>Summary</h2>`;
      html += `<div class="stat">${allLines.length} part-number lines found</div>`;
      html += `<div class="stat ${tailsWithContent > 0 ? 'ok' : 'warn'}">${tailsWithContent} lines have trailing text</div>`;
      html += `<div class="stat hi">${Object.keys(mCodeCounts).length} unique M-codes</div>`;
      html += `<div class="stat">${Object.keys(yearCounts).length} year-like tokens</div>`;
      html += '</div>';

      // Keyword hits
      html += `<div class="section"><h2>Known German PET Keywords Found</h2><div class="token-grid">`;
      for (const [kw, meaning] of Object.entries(KEYWORDS)) {
        const count = tokenCounts[kw] || 0;
        if (count > 0) {
          html += `<span class="token keyword" title="${meaning}">${escapeHtml(kw)} <b>${count}</b></span>`;
        } else {
          html += `<span class="token" style="opacity:0.3" title="${meaning}">${escapeHtml(kw)} 0</span>`;
        }
      }
      html += `</div></div>`;

      // M-codes
      if (topMCodes.length > 0) {
        html += `<div class="section"><h2>M-Code Frequency (option codes)</h2><div class="token-grid">`;
        for (const [code, count] of topMCodes) {
          html += `<span class="token mcode">${escapeHtml(code)} <b>${count}</b></span>`;
        }
        html += `</div></div>`;
      }

      // Year tokens
      if (topYears.length > 0) {
        html += `<div class="section"><h2>Year-like Tokens</h2><div class="token-grid">`;
        for (const [y, count] of topYears) {
          html += `<span class="token year">${escapeHtml(y)} <b>${count}</b></span>`;
        }
        html += `</div></div>`;
      }

      // Top tokens table
      html += `<div class="section"><h2>Top 60 Tokens (after M-codes and years)</h2>`;
      html += `<table><thead><tr><th>Token</th><th>Count</th><th>Freq</th><th>Known keyword?</th></tr></thead><tbody>`;
      for (const [tok, count] of topTokens) {
        const pct = Math.round((count / maxTok) * 120);
        const isKw = tok in KEYWORDS;
        html += `<tr><td>${escapeHtml(tok)}</td><td>${count}</td>
          <td><span class="bar" style="width:${pct}px"></span></td>
          <td>${isKw ? `<span class="stat ok">${escapeHtml(KEYWORDS[tok])}</span>` : ''}</td></tr>`;
      }
      html += `</tbody></table></div>`;

      output.innerHTML = html;
    }

    async function showRawLines() {
      await collectLines();
      const sample = allLines.filter(l => l.tail).slice(0, 100);
      let html = `<div class="section"><h2>Raw part-number lines with trailing text (first 100)</h2>`;
      html += `<table><thead><tr><th>Page</th><th>Part Number</th><th>Trailing text / applicability</th></tr></thead><tbody>`;
      for (const { pageNum, partNumber, tail } of sample) {
        html += `<tr><td>${pageNum}</td><td>${escapeHtml(partNumber)}</td><td>${escapeHtml(tail)}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      output.innerHTML = html;
    }

    async function showParsedExamples() {
      await collectLines();

      // Attempt to parse applicability conditions
      function parseCondition(tail) {
        if (!tail) return null;
        const results = [];
        // Model year range: "ab Mj YY", "bis Mj YY", "ab Mj YYYY"
        const mjFrom = tail.match(/\bab\s+Mj\s+(\d{2,4})\b/i);
        const mjTo = tail.match(/\bbis\s+Mj\s+(\d{2,4})\b/i);
        if (mjFrom) results.push({ type: 'year_from', value: mjFrom[1] });
        if (mjTo) results.push({ type: 'year_to', value: mjTo[1] });
        // M-codes
        const mCodes = tail.match(/\bM\d{3,4}\b/g) || [];
        for (const m of mCodes) results.push({ type: 'option', value: m });
        // nur (only)
        if (/\bnur\b/i.test(tail)) results.push({ type: 'modifier', value: 'only' });
        return results.length ? results : null;
      }

      const withTail = allLines.filter(l => l.tail).slice(0, 60);
      let html = `<div class="section"><h2>Parse attempt on applicability text (first 60 lines with trailing text)</h2>`;
      html += `<table><thead><tr><th>Part#</th><th>Raw tail</th><th>Parsed result</th></tr></thead><tbody>`;
      for (const { partNumber, tail } of withTail) {
        const parsed = parseCondition(tail);
        const parsedStr = parsed ? JSON.stringify(parsed) : '(no match)';
        const color = parsed ? '#4caf50' : '#888';
        html += `<tr><td>${escapeHtml(partNumber)}</td><td>${escapeHtml(tail)}</td><td style="color:${color}">${escapeHtml(parsedStr)}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      output.innerHTML = html;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
