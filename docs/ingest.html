<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ingest — pet-babelfish</title>
  <script>(function(){var t=localStorage.getItem('pb-theme');if(t)document.documentElement.dataset.theme=t;})()</script>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; margin: 0; background: var(--bg); color: var(--text);
           display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex;
             gap: 1rem; align-items: center; flex-wrap: wrap; }
    h1 { color: var(--text-hi); font-size: 1rem; margin: 0; }
    a { color: var(--accent); text-decoration: none; font-size: 0.8rem; }
    .main { display: grid; grid-template-columns: 340px 1fr; height: 100%; overflow: hidden; }
    #sidebar { border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; display: flex;
               flex-direction: column; gap: 0.75rem; }
    label { font-size: 0.8rem; color: var(--text3); display: block; margin-bottom: 0.2rem; }
    input[type=text], input[type=file] {
      width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--border3);
      padding: 0.4rem 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.85rem;
    }
    input[type=file] { padding: 0.3rem; cursor: pointer; }
    #dropzone { border: 2px dashed var(--border3); border-radius: 6px; padding: 1rem;
                text-align: center; color: var(--text3); cursor: pointer; font-size: 0.85rem;
                transition: border-color 0.15s; }
    #dropzone.over, #dropzone.loaded { border-color: var(--accent); color: var(--accent); }
    button.ingest { width: 100%; background: var(--accent-btn); color: var(--accent); border: 1px solid var(--accent);
             padding: 0.5rem; border-radius: 4px; cursor: pointer; font-family: monospace;
             font-size: 0.9rem; font-weight: bold; }
    button.ingest:hover:not(:disabled) { background: var(--accent-btn-h); }
    button.ingest:disabled { opacity: 0.4; cursor: not-allowed; }
    #progressWrap { display: none; }
    progress { width: 100%; height: 6px; accent-color: var(--accent); }
    #progressLabel { font-size: 0.78rem; color: var(--text3); margin-top: 0.2rem; }
    #log { flex: 1; overflow-y: auto; padding: 1rem; font-size: 0.78rem; line-height: 1.6; }
    .log-line { padding: 0.1rem 0; border-bottom: 1px solid var(--row-border); }
    .log-line.ok   { color: var(--accent); }
    .log-line.err  { color: var(--err); }
    .log-line.info { color: var(--text2); }
    .stat { display: inline-block; background: var(--bg2); border: 1px solid var(--border2);
            border-radius: 3px; padding: 0.15rem 0.4rem; margin: 0.1rem; font-size: 0.78rem; }
    .stat.ok { border-color: var(--accent); color: var(--accent); }
    #result { display: none; margin-top: 0.5rem; }
    hr { border: none; border-top: 1px solid var(--border); margin: 0.25rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Ingest PET Catalog</h1>
    <a href="index.html">← home</a>
    <a href="viewer.html" id="viewerLink" style="display:none">Open viewer →</a>
    <button class="theme-toggle" style="margin-left:auto" onclick="themeToggle.cycle()">auto</button>
  </header>

  <div class="main">
    <div id="sidebar">
      <div>
        <label>Catalog PDF</label>
        <div id="dropzone">
          Drop PDF here or click to pick
          <input type="file" id="fileInput" accept=".pdf" style="display:none">
        </div>
      </div>

      <div>
        <label for="catalogId">Catalog ID <span style="color:var(--text5)">(used as storage key)</span></label>
        <input type="text" id="catalogId" placeholder="e.g. 997TT-2005">
      </div>

      <div>
        <label for="sectionFilter">Sections to re-ingest <span style="color:var(--text5)">(optional — blank = all)</span></label>
        <input type="text" id="sectionFilter" placeholder="e.g. 101-000, 102-000">
      </div>

      <div>
        <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer">
          <input type="checkbox" id="partsOnly">
          Parts only <span style="color:var(--text5)">(skip diagram re-render / OCR)</span>
        </label>
      </div>

      <div id="progressWrap">
        <hr>
        <label id="progressLabel">—</label>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>

      <button class="ingest" id="ingestBtn" disabled>Ingest</button>

      <div id="result"></div>
    </div>

    <div id="log">
      <div class="log-line info">Load a PDF and set a catalog ID, then click Ingest.</div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    let selectedFile = null;
    let worker = null;

    const dropzone        = document.getElementById('dropzone');
    const fileInput       = document.getElementById('fileInput');
    const catalogIdEl     = document.getElementById('catalogId');
    const sectionFilterEl = document.getElementById('sectionFilter');
    const partsOnlyEl     = document.getElementById('partsOnly');
    const ingestBtn       = document.getElementById('ingestBtn');
    const logEl       = document.getElementById('log');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const progressWrap  = document.getElementById('progressWrap');
    const resultEl    = document.getElementById('result');
    const viewerLink  = document.getElementById('viewerLink');

    // ── File picking ────────────────────────────────────────────────────────

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('over');
      setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => setFile(e.target.files[0]));

    function setFile(file) {
      if (!file || !file.name.endsWith('.pdf')) return;
      selectedFile = file;
      dropzone.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      dropzone.classList.add('loaded');
      // Pre-fill catalog ID from filename if empty
      if (!catalogIdEl.value.trim()) {
        catalogIdEl.value = file.name.replace(/\.pdf$/i, '').replace(/\s+/g, '-');
      }
      updateBtn();
    }

    catalogIdEl.addEventListener('input', updateBtn);
    sectionFilterEl.addEventListener('input', updateBtn);
    partsOnlyEl.addEventListener('change', updateBtn);

    function updateBtn() {
      ingestBtn.disabled = !(selectedFile && catalogIdEl.value.trim());
      const filter   = sectionFilterEl.value.trim();
      const partsOnly = partsOnlyEl.checked;
      if (!filter && !partsOnly) ingestBtn.textContent = 'Ingest';
      else if (!filter)          ingestBtn.textContent = 'Re-ingest parts (all sections)';
      else if (!partsOnly)       ingestBtn.textContent = 'Re-ingest sections';
      else                       ingestBtn.textContent = 'Re-ingest sections (parts only)';
    }

    // ── Ingest ──────────────────────────────────────────────────────────────

    ingestBtn.addEventListener('click', startIngest);

    async function startIngest() {
      if (!selectedFile || !catalogIdEl.value.trim()) return;

      // Reset UI
      logEl.innerHTML = '';
      resultEl.style.display = 'none';
      viewerLink.style.display = 'none';
      progressWrap.style.display = 'block';
      progressBar.value = 0;
      progressLabel.textContent = 'Starting…';
      ingestBtn.disabled = true;

      const catalogId    = catalogIdEl.value.trim();
      const sectionFilter = sectionFilterEl.value.trim();
      const sectionNums   = sectionFilter
        ? sectionFilter.split(',').map(s => s.trim()).filter(Boolean)
        : null;
      const partsOnly = partsOnlyEl.checked;
      const partial   = sectionNums !== null || partsOnly;

      let logMsg;
      if (!partial)          logMsg = `Ingesting "${selectedFile.name}" as catalog "${catalogId}"…`;
      else if (sectionNums)  logMsg = `Re-ingesting [${sectionNums.join(', ')}] from "${selectedFile.name}"${partsOnly ? ' (parts only)' : ''}…`;
      else                   logMsg = `Re-ingesting all sections from "${selectedFile.name}" (parts only)…`;
      appendLog(logMsg, 'info');

      const buffer = await selectedFile.arrayBuffer();

      // Terminate any previous worker
      if (worker) worker.terminate();
      worker = new Worker('ingest.worker.js');

      worker.onmessage = ({ data }) => {
        switch (data.type) {
          case 'status':
            appendLog(data.message, 'info');
            progressLabel.textContent = data.message;
            break;

          case 'progress':
            progressBar.value = data.pct;
            progressLabel.textContent = `${data.pct}% — ${data.label}`;
            appendLog(`[${String(data.pct).padStart(3)}%] ${data.label}`, 'info');
            break;

          case 'done':
            progressBar.value = 100;
            progressLabel.textContent = 'Done';
            appendLog(
              partial
                ? `✓ Done — ${data.sectionCount} section(s) re-ingested, ${data.partCount} parts.`
                : `✓ Done — ${data.sectionCount} sections, ${data.partCount} parts ingested.`,
              'ok'
            );
            resultEl.innerHTML = `
              <span class="stat ok">✓ ${data.sectionCount} section${data.sectionCount !== 1 ? 's' : ''}</span>
              <span class="stat ok">${data.partCount} parts</span>
              <span class="stat ok">saved to OPFS</span>
            `;
            resultEl.style.display = 'block';
            viewerLink.style.display = 'inline';
            viewerLink.href = `viewer.html?catalog=${encodeURIComponent(catalogId)}`;
            ingestBtn.disabled = false;
            updateBtn();
            worker = null;
            break;

          case 'error':
            appendLog(`✗ Error: ${data.message}`, 'err');
            progressLabel.textContent = 'Failed — see log';
            ingestBtn.disabled = false;
            worker = null;
            break;
        }
      };

      worker.onerror = (e) => {
        appendLog(`✗ Worker error: ${e.message}`, 'err');
        ingestBtn.disabled = false;
        worker = null;
      };

      // Transfer buffer ownership to worker (zero-copy)
      if (partial) {
        worker.postMessage({ type: 'reingest-sections', buffer, catalogId, sectionNums, partsOnly }, [buffer]);
      } else {
        worker.postMessage({ type: 'ingest', buffer, catalogId }, [buffer]);
      }
    }

    function appendLog(text, cls = 'info') {
      const div = document.createElement('div');
      div.className = `log-line ${cls}`;
      div.textContent = `${timestamp()} ${text}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function timestamp() {
      const d = new Date();
      return `[${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}]`;
    }
  </script>
</body>
</html>
