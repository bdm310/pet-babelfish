<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ingest — pet-babelfish</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; margin: 0; background: #1a1a1a; color: #e0e0e0;
           display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 0.75rem 1rem; border-bottom: 1px solid #333; display: flex;
             gap: 1rem; align-items: center; flex-wrap: wrap; }
    h1 { color: #fff; font-size: 1rem; margin: 0; }
    a { color: #4caf50; text-decoration: none; font-size: 0.8rem; }
    .main { display: grid; grid-template-columns: 340px 1fr; height: 100%; overflow: hidden; }
    #sidebar { border-right: 1px solid #333; padding: 1rem; overflow-y: auto; display: flex;
               flex-direction: column; gap: 0.75rem; }
    label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 0.2rem; }
    input[type=text], input[type=file] {
      width: 100%; background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
      padding: 0.4rem 0.5rem; border-radius: 4px; font-family: monospace; font-size: 0.85rem;
    }
    input[type=file] { padding: 0.3rem; cursor: pointer; }
    #dropzone { border: 2px dashed #555; border-radius: 6px; padding: 1rem;
                text-align: center; color: #888; cursor: pointer; font-size: 0.85rem;
                transition: border-color 0.15s; }
    #dropzone.over, #dropzone.loaded { border-color: #4caf50; color: #4caf50; }
    button { width: 100%; background: #2a4a2a; color: #4caf50; border: 1px solid #4caf50;
             padding: 0.5rem; border-radius: 4px; cursor: pointer; font-family: monospace;
             font-size: 0.9rem; font-weight: bold; }
    button:hover:not(:disabled) { background: #3a5a3a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #progressWrap { display: none; }
    progress { width: 100%; height: 6px; accent-color: #4caf50; }
    #progressLabel { font-size: 0.78rem; color: #888; margin-top: 0.2rem; }
    #log { flex: 1; overflow-y: auto; padding: 1rem; font-size: 0.78rem; line-height: 1.6; }
    .log-line { padding: 0.1rem 0; border-bottom: 1px solid #1e1e1e; }
    .log-line.ok   { color: #4caf50; }
    .log-line.err  { color: #f44336; }
    .log-line.info { color: #aaa; }
    .stat { display: inline-block; background: #2a2a2a; border: 1px solid #444;
            border-radius: 3px; padding: 0.15rem 0.4rem; margin: 0.1rem; font-size: 0.78rem; }
    .stat.ok { border-color: #4caf50; color: #4caf50; }
    #result { display: none; margin-top: 0.5rem; }
    hr { border: none; border-top: 1px solid #333; margin: 0.25rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Ingest PET Catalog</h1>
    <a href="index.html">← home</a>
    <a href="viewer.html" id="viewerLink" style="display:none">Open viewer →</a>
  </header>

  <div class="main">
    <div id="sidebar">
      <div>
        <label>Catalog PDF</label>
        <div id="dropzone">
          Drop PDF here or click to pick
          <input type="file" id="fileInput" accept=".pdf" style="display:none">
        </div>
      </div>

      <div>
        <label for="catalogId">Catalog ID <span style="color:#555">(used as storage key)</span></label>
        <input type="text" id="catalogId" placeholder="e.g. 997TT-2005">
      </div>

      <div id="progressWrap">
        <hr>
        <label id="progressLabel">—</label>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>

      <button id="ingestBtn" disabled>Ingest</button>

      <div id="result"></div>
    </div>

    <div id="log">
      <div class="log-line info">Load a PDF and set a catalog ID, then click Ingest.</div>
    </div>
  </div>

  <script>
    let selectedFile = null;
    let worker = null;

    const dropzone    = document.getElementById('dropzone');
    const fileInput   = document.getElementById('fileInput');
    const catalogIdEl = document.getElementById('catalogId');
    const ingestBtn   = document.getElementById('ingestBtn');
    const logEl       = document.getElementById('log');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const progressWrap  = document.getElementById('progressWrap');
    const resultEl    = document.getElementById('result');
    const viewerLink  = document.getElementById('viewerLink');

    // ── File picking ────────────────────────────────────────────────────────

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('over');
      setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => setFile(e.target.files[0]));

    function setFile(file) {
      if (!file || !file.name.endsWith('.pdf')) return;
      selectedFile = file;
      dropzone.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      dropzone.classList.add('loaded');
      // Pre-fill catalog ID from filename if empty
      if (!catalogIdEl.value.trim()) {
        catalogIdEl.value = file.name.replace(/\.pdf$/i, '').replace(/\s+/g, '-');
      }
      updateBtn();
    }

    catalogIdEl.addEventListener('input', updateBtn);

    function updateBtn() {
      ingestBtn.disabled = !(selectedFile && catalogIdEl.value.trim());
    }

    // ── Ingest ──────────────────────────────────────────────────────────────

    ingestBtn.addEventListener('click', startIngest);

    async function startIngest() {
      if (!selectedFile || !catalogIdEl.value.trim()) return;

      // Reset UI
      logEl.innerHTML = '';
      resultEl.style.display = 'none';
      viewerLink.style.display = 'none';
      progressWrap.style.display = 'block';
      progressBar.value = 0;
      progressLabel.textContent = 'Starting…';
      ingestBtn.disabled = true;

      const catalogId = catalogIdEl.value.trim();
      appendLog(`Ingesting "${selectedFile.name}" as catalog "${catalogId}"…`, 'info');

      const buffer = await selectedFile.arrayBuffer();

      // Terminate any previous worker
      if (worker) worker.terminate();
      worker = new Worker('ingest.worker.js');

      worker.onmessage = ({ data }) => {
        switch (data.type) {
          case 'status':
            appendLog(data.message, 'info');
            progressLabel.textContent = data.message;
            break;

          case 'progress':
            progressBar.value = data.pct;
            progressLabel.textContent = `${data.pct}% — ${data.label}`;
            appendLog(`[${String(data.pct).padStart(3)}%] ${data.label}`, 'info');
            break;

          case 'done':
            progressBar.value = 100;
            progressLabel.textContent = 'Done';
            appendLog(
              `✓ Done — ${data.sectionCount} sections, ${data.partCount} parts ingested.`, 'ok'
            );
            resultEl.innerHTML = `
              <span class="stat ok">✓ ${data.sectionCount} sections</span>
              <span class="stat ok">${data.partCount} parts</span>
              <span class="stat ok">saved to OPFS</span>
            `;
            resultEl.style.display = 'block';
            viewerLink.style.display = 'inline';
            viewerLink.href = `viewer.html?catalog=${encodeURIComponent(catalogId)}`;
            ingestBtn.disabled = false;
            ingestBtn.textContent = 'Ingest again';
            worker = null;
            break;

          case 'error':
            appendLog(`✗ Error: ${data.message}`, 'err');
            progressLabel.textContent = 'Failed — see log';
            ingestBtn.disabled = false;
            worker = null;
            break;
        }
      };

      worker.onerror = (e) => {
        appendLog(`✗ Worker error: ${e.message}`, 'err');
        ingestBtn.disabled = false;
        worker = null;
      };

      // Transfer buffer ownership to worker (zero-copy)
      worker.postMessage({ type: 'ingest', buffer, catalogId }, [buffer]);
    }

    function appendLog(text, cls = 'info') {
      const div = document.createElement('div');
      div.className = `log-line ${cls}`;
      div.textContent = `${timestamp()} ${text}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function timestamp() {
      const d = new Date();
      return `[${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}]`;
    }
  </script>
</body>
</html>
